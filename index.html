<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>Carpet Business</title>
<link rel="manifest" href="manifest.json" />
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#2563eb;--good:#0f766e;--warn:#b45309;--danger:#b91c1c;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px;margin-top:2px}.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 3px 14px #1118270c;font-size:18px}.screen{padding:0 18px}.hero{background:linear-gradient(135deg,#111827,#293548);color:#fff;border-radius:26px;padding:23px;margin:8px 0 14px;box-shadow:0 12px 30px #11182722}.hero .label{opacity:.72;font-size:13px}.hero .amount{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin-top:7px}.hero .row{display:flex;justify-content:space-between;margin-top:20px;font-size:13px}.hero .row span:last-child{font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid #ffffff;border-radius:20px;padding:16px;box-shadow:0 5px 20px #11182708}.metric .title{font-size:12px;color:var(--muted)}.metric .value{font-size:21px;font-weight:800;margin-top:5px}.metric .tap{font-size:11px;color:var(--accent2);margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-weight:800}.link{color:var(--accent2);font-size:13px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 5px;font-size:11px;font-weight:700;color:var(--text)}.quick .ico{display:block;font-size:20px;margin-bottom:5px}.activity{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.dot{width:38px;height:38px;border-radius:13px;background:#eef2ff;display:grid;place-items:center}.grow{flex:1}.name{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.amt{font-weight:800;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav{background:none;color:var(--muted);font-size:10px;font-weight:700;padding:5px}.nav.active{color:var(--text)}.nav span{display:block;font-size:20px;margin-bottom:3px}.page{display:none}.page.active{display:block}.toolbar{display:flex;gap:9px;margin:12px 0}.search{flex:1;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px;outline:none}.primary{background:var(--accent);color:#fff;border-radius:14px;padding:12px 15px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:700}.list-card{background:#fff;border-radius:18px;padding:15px;margin:9px 0;border:1px solid var(--line)}.list-row{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:700;margin:5px 5px 0 0}.green{color:var(--good)}.red{color:var(--danger)}.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(540px,100%);margin:auto 0 0;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:20px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff}.actions{display:flex;gap:9px;margin-top:16px}.actions>*{flex:1}.empty{text-align:center;color:var(--muted);padding:30px 10px}.money{font-variant-numeric:tabular-nums}.hidden{display:none!important}@media(min-width:541px){body{padding-bottom:20px}.bottom{bottom:20px;border-radius:20px;width:520px;border:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Carpet Business</div><div class="sub">Business control center</div></div><button class="iconbtn" onclick="openModal('settings')">⚙️</button></div>
  <main class="screen">
    <section id="dashboard" class="page active">
      <div class="hero"><div class="label">Total business balance</div><div class="amount money" id="totalBalance">ETB 0</div><div class="row"><span>Updated automatically</span><span id="today"></span></div></div>
      <div class="grid">
        <button class="card metric" onclick="go('money')"><div class="title">🏦 Bank</div><div class="value money" id="bankTotal">ETB 0</div><div class="tap">View accounts →</div></button>
        <button class="card metric" onclick="go('money')"><div class="title">💵 Cash</div><div class="value money" id="cashTotal">ETB 0</div><div class="tap">View cash →</div></button>
        <button class="card metric" onclick="go('customers')"><div class="title">🤝 Customer credit</div><div class="value money" id="creditTotal">ETB 0</div><div class="tap">View customers →</div></button>
        <button class="card metric" onclick="go('inventory')"><div class="title">📦 Inventory</div><div class="value money" id="inventoryValue">ETB 0</div><div class="tap">View stock →</div></button>
      </div>
      <div class="section-title"><span>Quick actions</span></div>
      <div class="quick"><button onclick="openModal('roll')"><span class="ico">📦</span>Add roll</button><button onclick="openModal('sale')"><span class="ico">🧾</span>Sale</button><button onclick="openModal('payment')"><span class="ico">💳</span>Payment</button><button onclick="openModal('expense')"><span class="ico">💸</span>Expense</button></div>
      <div class="section-title"><span>This month</span></div>
      <div class="grid"><div class="card metric"><div class="title">Sales</div><div class="value money" id="monthSales">ETB 0</div></div><div class="card metric"><div class="title">Gross profit</div><div class="value money" id="grossProfit">ETB 0</div></div><div class="card metric"><div class="title">Expenses</div><div class="value money" id="monthExpenses">ETB 0</div></div><div class="card metric"><div class="title">Net profit</div><div class="value money" id="netProfit">ETB 0</div></div></div>
      <div class="section-title"><span>Recent activity</span></div><div class="card" id="activity"></div>
    </section>

    <section id="inventory" class="page"><div class="section-title"><span>Inventory</span><button class="primary" onclick="openModal('roll')">+ Roll</button></div><div class="toolbar"><input id="inventorySearch" class="search" placeholder="Search design or color" oninput="renderInventory()"/></div><div id="inventoryList"></div></section>
    <section id="sales" class="page"><div class="section-title"><span>Sales</span><button class="primary" onclick="openModal('sale')">+ Sale</button></div><div id="salesList"></div></section>
    <section id="customers" class="page"><div class="section-title"><span>Customers</span><button class="primary" onclick="openModal('payment')">+ Payment</button></div><div id="customerList"></div></section>
    <section id="money" class="page"><div class="section-title"><span>Money</span><button class="primary" onclick="openModal('expense')">+ Expense</button></div><div id="moneyList"></div></section>
  </main>
  <nav class="bottom"><button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span>⌂</span>Home</button><button class="nav" data-page="inventory" onclick="go('inventory')"><span>▦</span>Inventory</button><button class="nav" data-page="sales" onclick="go('sales')"><span>▤</span>Sales</button><button class="nav" data-page="customers" onclick="go('customers')"><span>♙</span>Customers</button><button class="nav" data-page="money" onclick="go('money')"><span>₿</span>Money</button></nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='carpetBusinessMVP';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{rolls:[],sales:[],payments:[],expenses:[],accounts:[{id:'bank1',name:'Main Bank',balance:0}],cash:0,customers:{},recurringSalary:null}; db.recurringSalary=db.recurringSalary||null;
// Normalize early prototype records to the current m²-based model.
db.rolls.forEach(r=>{if(r.remainingArea==null) r.remainingArea=(r.remainingM??r.length)*r.width; if(r.area==null) r.area=r.length*r.width; if(r.costPerSqM==null&&r.cost!=null) r.costPerSqM=r.cost/(r.length*r.width);});
db.sales.forEach(s=>{if(s.areaM2==null&&s.meters!=null) s.areaM2=s.meters*4;});
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function money(n){return 'ETB '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function id(prefix){return prefix+Date.now()+Math.random().toString(16).slice(2,7)}
function month(d=new Date()){return d.toISOString().slice(0,7)}
function totalInventory(){return db.rolls.reduce((s,r)=>s+(r.remainingArea ?? r.length*r.width),0)}
function invValue(){return db.rolls.reduce((s,r)=>s+((r.remainingArea ?? r.length*r.width)*r.costPerSqM),0)}
function bankTotal(){return db.accounts.reduce((s,a)=>s+Number(a.balance||0),0)}
function creditTotal(){return Object.values(db.customers).reduce((s,c)=>s+Number(c.balance||0),0)}
function currentMonth(a){return a.date&&a.date.slice(0,7)===month()}
function salesMonth(){return db.sales.filter(currentMonth).reduce((s,x)=>s+x.total,0)}
function grossMonth(){return db.sales.filter(currentMonth).reduce((s,x)=>s+x.grossProfit,0)}
function expensesMonth(){return db.expenses.filter(currentMonth).reduce((s,x)=>s+x.amount,0)}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));renderAll();window.scrollTo(0,0)}
function openModal(type){const s=document.getElementById('sheet');let html='';
 if(type==='roll')html=`<h2>Add carpet roll</h2><div class="field"><label>Design code</label><input id="rDesign" placeholder="Niya / 136 / 137" oninput="checkDesignAvailability()"><div id="designStatus" class="meta" style="margin-top:6px"></div></div><div class="field"><label>Color</label><input id="rColor" placeholder="327 / F-106 / Red"></div><div class="field"><label>Length (meters)</label><input id="rLength" type="number" step="0.01" min="0.01" placeholder="42"></div><div class="field"><label>Purchase cost per m² (ETB)</label><input id="rCost" type="number" step="0.01" min="0.01" placeholder="1400"></div><div class="field"><label>Width (meters)</label><input id="rWidth" type="number" step="0.01" value="4" readonly></div><div class="field"><label>Paid from</label><select id="rAccount"><option value="cash">Cash</option>${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div id="rollTotal" class="card" style="margin-top:12px;background:#f8fafc"><div class="meta">Purchase total</div><strong id="rollTotalValue">ETB 0</strong></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button id="saveRollBtn" class="primary" onclick="addRoll()">Save roll</button></div>`;
 if(type==='sale')html=`<h2>Record sale</h2><div class="field"><label>Customer</label><input id="sCustomer" placeholder="Customer name"></div><div class="field"><label>Design code</label><input id="sDesign" placeholder="D105"></div><div class="field"><label>Color</label><input id="sColor" placeholder="Beige"></div><div class="field"><label>m² sold</label><input id="sMeters" type="number" step="0.01"></div><div class="field"><label>Selling price / m²</label><input id="sPrice" type="number" step="0.01"></div><div class="field"><label>Payment</label><select id="sPayment"><option value="credit">Credit</option><option value="bank">Bank transfer</option><option value="cash">Cash</option></select></div><div class="field" id="accountField"><label>Bank account</label><select id="sAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addSale()">Save sale</button></div>`;
 if(type==='payment')html=`<h2>Customer payment</h2><div class="field"><label>Customer</label><select id="pCustomer">${Object.keys(db.customers).length?Object.values(db.customers).map(c=>`<option value="${c.name}">${c.name} — ${money(c.balance)}</option>`).join(''):'<option>No credit customers yet</option>'}</select></div><div class="field"><label>Amount</label><input id="pAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="pAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addPayment()">Record payment</button></div>`;
 if(type==='expense')html=`<h2>Add expense</h2><div class="field"><label>Category</label><select id="eCat"><option>Salary</option><option>Labor</option><option>Transportation</option><option>Other</option></select></div><div class="field"><label>Amount</label><input id="eAmount" type="number" step="0.01"></div><div class="field"><label>Paid from</label><select id="eAccount"><option value="cash">Cash</option>${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addExpense()">Save expense</button></div>`;
 if(type==='settings')html=`<h2>Settings</h2><div class="field"><label>Bank accounts</label>${db.accounts.map(a=>`<div class="list-card"><div class="list-row"><strong>${a.name}</strong><strong>${money(a.balance)}</strong></div></div>`).join('')}</div><div class="field"><label>Monthly salary</label><input id="salaryAmount" type="number" step="0.01" value="${db.recurringSalary?.amount||''}" placeholder="0"></div><div class="field"><label>Salary paid from</label><select id="salaryAccount"><option value="cash" ${db.recurringSalary?.source==='cash'?'selected':''}>Cash</option>${db.accounts.map(a=>`<option value="${a.id}" ${db.recurringSalary?.source===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button class="secondary" onclick="saveSalary()">Save salary</button><button class="primary" onclick="addBank()">+ Bank account</button></div>`;
 s.innerHTML=html;document.getElementById('modal').classList.add('show');if(type==='sale')togglePay();if(type==='roll'){const updateRollTotal=()=>{const len=+document.getElementById('rLength').value||0;const cost=+document.getElementById('rCost').value||0;document.getElementById('rollTotalValue').textContent=money(len*4*cost)};document.getElementById('rLength').addEventListener('input',updateRollTotal);document.getElementById('rCost').addEventListener('input',updateRollTotal);updateRollTotal();}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function checkDesignAvailability(){const design=rDesign.value.trim();const el=document.getElementById('designStatus'),btn=document.getElementById('saveRollBtn');if(!design){el.textContent='Design code must be unique while stock remains.';btn.disabled=false;return}const activeSameDesign=db.rolls.some(r=>r.design.trim().toLowerCase()===design.toLowerCase()&&(r.remainingArea??r.length*r.width)>0.000001);if(activeSameDesign){el.textContent=`⚠️ ${design} is already active in inventory. You can reuse it only after all ${design} stock is sold out.`;btn.disabled=true}else{el.textContent=`✓ ${design} is available.`;btn.disabled=false}}

function addRoll(){const design=rDesign.value.trim(),color=rColor.value.trim(),length=+rLength.value,costPerSqM=+rCost.value,width=4,src=rAccount.value;const area=length*width,total=area*costPerSqM;if(!design||!color||!length||!costPerSqM)return alert('Please complete design, color, length and purchase cost per m².');const activeSameDesign=db.rolls.some(r=>r.design.trim().toLowerCase()===design.toLowerCase()&&(r.remainingArea??r.length*r.width)>0.000001);if(activeSameDesign){alert(`Design '${design}' already has stock. You cannot create another active ${design} design until it is sold out.`);return;}if(src==='cash'){if(db.cash<total)return alert(`Not enough cash. Purchase total is ${money(total)}.`);db.cash-=total}else{const a=db.accounts.find(x=>x.id===src);if(!a||a.balance<total)return alert(`Not enough balance. Purchase total is ${money(total)}.`);a.balance-=total}db.rolls.push({id:id('R'),design,color,length,width,area,remainingArea:area,costPerSqM,purchaseTotal:total,paymentSource:src,date:new Date().toISOString()});closeModal();save()}
function addSale(){const customer=sCustomer.value.trim(),design=sDesign.value.trim(),color=sColor.value.trim(),areaSold=+sMeters.value,price=+sPrice.value,pay=sPayment.value;if(!customer||!design||!color||!areaSold||!price)return alert('Please complete all sale fields.');let matching=db.rolls.filter(r=>r.design.toLowerCase()===design.toLowerCase()&&r.color.toLowerCase()===color.toLowerCase());let avail=matching.reduce((sum,r)=>sum+(r.remainingArea ?? r.length*r.width),0);if(areaSold>avail)return alert(`Not enough stock. Available: ${avail.toFixed(2)} m².`);let left=areaSold,costTotal=0;for(const r of matching){const current=r.remainingArea ?? r.length*r.width;const take=Math.min(current,left);costTotal+=take*r.costPerSqM;r.remainingArea=current-take;left-=take;if(left<=0)break}const total=areaSold*price;const gross=total-costTotal;db.sales.unshift({id:id('S'),date:new Date().toISOString(),customer,design,color,areaM2:areaSold,price,total,costOfSale:costTotal,grossProfit:gross,payment:pay,accountId:pay==='bank'?sAccount.value:null});if(!db.customers[customer])db.customers[customer]={name:customer,balance:0};if(pay==='credit')db.customers[customer].balance+=total;else if(pay==='cash')db.cash+=total;else{const a=db.accounts.find(x=>x.id===sAccount.value);if(a)a.balance+=total}closeModal();save()}
function addPayment(){const c=pCustomer.value,a=db.accounts.find(x=>x.id===pAccount.value),amt=+pAmount.value;if(!c||!amt||!a)return alert('Please complete the payment.');if(!db.customers[c]||db.customers[c].balance<amt)return alert('Payment is greater than the outstanding balance.');db.customers[c].balance-=amt;a.balance+=amt;db.payments.unshift({id:id('P'),date:new Date().toISOString(),customer:c,amount:amt,account:a.name,accountId:a.id});closeModal();save()}
function addExpense(){const cat=eCat.value,amt=+eAmount.value,src=eAccount.value;if(!amt)return alert('Enter an amount.');if(src==='cash'){if(db.cash<amt)return alert('Not enough cash.');db.cash-=amt}else{const a=db.accounts.find(x=>x.id===src);if(!a||a.balance<amt)return alert('Not enough balance in this account.');a.balance-=amt}db.expenses.unshift({id:id('E'),date:new Date().toISOString(),category:cat,amount:amt,source:src});closeModal();save()}
function saveSalary(){const amount=+document.getElementById('salaryAmount').value,source=document.getElementById('salaryAccount').value;if(!amount){db.recurringSalary=null;save();return}db.recurringSalary={amount,source};save();closeModal()}
function processRecurringSalary(){if(!db.recurringSalary?.amount)return;const ym=month();const already=db.expenses.some(e=>e.category==='Salary'&&e.recurring===true&&e.date.slice(0,7)===ym);if(already)return;const amt=db.recurringSalary.amount,src=db.recurringSalary.source;if(src==='cash'){if(db.cash<amt)return}else{const a=db.accounts.find(x=>x.id===src);if(!a||a.balance<amt)return}if(src==='cash')db.cash-=amt;else db.accounts.find(x=>x.id===src).balance-=amt;db.expenses.unshift({id:id('E'),date:new Date().toISOString(),category:'Salary',amount:amt,source:src,recurring:true});localStorage.setItem(KEY,JSON.stringify(db))}
function addBank(){const name=prompt('Bank account name');if(!name)return;const initial=Number(prompt('Opening balance (ETB)','0')||0);if(initial<0)return alert('Opening balance cannot be negative.');db.accounts.push({id:id('B'),name,balance:initial,createdAt:new Date().toISOString()});openModal('settings');save()}
function accountActivity(accountId){let rows=[];db.sales.filter(x=>x.payment==='bank'&&x.accountId===accountId).forEach(x=>rows.push({date:x.date,type:'Customer sale',name:x.customer,amount:x.total,dir:'in'}));db.payments.filter(x=>x.accountId===accountId).forEach(x=>rows.push({date:x.date,type:'Customer payment',name:x.customer,amount:x.amount,dir:'in'}));db.rolls.filter(x=>x.paymentSource===accountId).forEach(x=>rows.push({date:x.date,type:'Carpet purchase',name:`${x.design} · ${x.color}`,amount:x.purchaseTotal,dir:'out'}));db.expenses.filter(x=>x.source===accountId).forEach(x=>rows.push({date:x.date,type:x.category,name:'Expense',amount:x.amount,dir:'out'}));return rows.sort((a,b)=>new Date(b.date)-new Date(a.date))}
function toggleAccount(id){const el=document.getElementById('acct-'+id);if(el)el.classList.toggle('hidden')}
function togglePay(){const el=document.getElementById('sPayment');if(el)el.onchange=()=>document.getElementById('accountField').classList.toggle('hidden',el.value!=='bank');}
function renderDashboard(){document.getElementById('bankTotal').textContent=money(bankTotal());document.getElementById('cashTotal').textContent=money(db.cash);document.getElementById('creditTotal').textContent=money(creditTotal());document.getElementById('inventoryValue').textContent=money(invValue());document.getElementById('totalBalance').textContent=money(bankTotal()+db.cash+creditTotal()+invValue());document.getElementById('monthSales').textContent=money(salesMonth());document.getElementById('grossProfit').textContent=money(grossMonth());document.getElementById('monthExpenses').textContent=money(expensesMonth());document.getElementById('netProfit').textContent=money(grossMonth()-expensesMonth());document.getElementById('today').textContent=new Date().toLocaleDateString();let acts=[...db.sales.slice(0,4).map(x=>({icon:'🧾',name:`Sale · ${x.design} ${x.color}`,meta:`${x.customer} · ${x.areaM2.toFixed(2)} m²`,amt:x.total})),...db.payments.slice(0,4).map(x=>({icon:'💳',name:`Payment · ${x.customer}`,meta:x.account,amt:x.amount}))].sort((a,b)=>0);document.getElementById('activity').innerHTML=acts.length?acts.slice(0,6).map(a=>`<div class="activity"><div class="dot">${a.icon}</div><div class="grow"><div class="name">${a.name}</div><div class="meta">${a.meta}</div></div><div class="amt">${money(a.amt)}</div></div>`).join(''):'<div class="empty">No activity yet.</div>'}
function renderInventory(){const q=(document.getElementById('inventorySearch')?.value||'').toLowerCase();let groups={};db.rolls.forEach(r=>{const k=r.design+'|'+r.color;(groups[k]??={design:r.design,color:r.color,m:0,value:0,rolls:[]});groups[k].m+=(r.remainingArea ?? r.length*r.width);groups[k].value+=(r.remainingArea ?? r.length*r.width)*r.costPerSqM;groups[k].rolls.push(r)});let arr=Object.values(groups).filter(g=>(g.design+' '+g.color).toLowerCase().includes(q));document.getElementById('inventoryList').innerHTML=arr.length?arr.map((g,i)=>`<div class="list-card"><button style="width:100%;background:none;text-align:left;padding:0" onclick="toggleInv('${CSS.escape(g.design+'|'+g.color)}')"><div class="list-row"><div><strong>${g.design}</strong><div class="meta">${g.color}</div></div><div style="text-align:right"><strong>${g.m.toFixed(2)} m²</strong><div class="meta">${g.rolls.length} roll${g.rolls.length===1?'':'s'} · tap for rolls</div></div></div><div><span class="pill">${g.rolls.length} rolls</span><span class="pill">${money(g.value)}</span></div></button><div id="inv-${encodeURIComponent(g.design+'|'+g.color)}" class="hidden" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">${g.rolls.map((r,n)=>`<div class="activity"><div class="dot">📦</div><div class="grow"><div class="name">Roll ${n+1}</div><div class="meta">Original ${Number(r.length).toFixed(2)} m · Cost ${money(r.costPerSqM)}/m²</div></div><div class="amt">${Number(r.remainingArea??0).toFixed(2)} m²</div></div>`).join('')}</div></div>`).join(''):'<div class="empty">No inventory yet.</div>'}
function toggleInv(key){const el=document.getElementById('inv-'+encodeURIComponent(key));if(el)el.classList.toggle('hidden')}
function renderSales(){document.getElementById('salesList').innerHTML=db.sales.length?db.sales.map(s=>`<div class="list-card"><div class="list-row"><div><strong>${s.design} · ${s.color}</strong><div class="meta">${s.customer} · ${new Date(s.date).toLocaleDateString()}</div></div><strong>${money(s.total)}</strong></div><div><span class="pill">${s.areaM2.toFixed(2)} m²</span><span class="pill">${money(s.price)}/m²</span><span class="pill">${s.payment}</span><span class="pill green">Gross ${money(s.grossProfit)}</span></div></div>`).join(''):'<div class="empty">No sales yet.</div>'}
function renderCustomers(){const cs=Object.values(db.customers).filter(c=>c.balance>0);document.getElementById('customerList').innerHTML=cs.length?cs.map(c=>`<div class="list-card"><div class="list-row"><div><strong>${c.name}</strong><div class="meta">Outstanding credit</div></div><strong class="red">${money(c.balance)}</strong></div></div>`).join(''):'<div class="empty">No outstanding customer credit.</div>'}
function renderMoney(){let accountsHtml=db.accounts.map(a=>{const rows=accountActivity(a.id);let tx=rows.length?rows.map(r=>`<div class="activity"><div class="dot">${r.dir==='in'?'↗️':'↘️'}</div><div class="grow"><div class="name">${r.type}</div><div class="meta">${r.name} · ${new Date(r.date).toLocaleDateString()}</div></div><div class="amt ${r.dir==='in'?'green':'red'}">${r.dir==='in'?'+':'−'}${money(r.amount)}</div></div>`).join(''):'<div class="empty" style="padding:18px">No transactions yet.</div>';return `<div class="list-card"><button style="width:100%;background:none;text-align:left;padding:0" onclick="toggleAccount('${a.id}')"><div class="list-row"><div><strong>${a.name}</strong><div class="meta">Bank account · tap for transactions</div></div><strong>${money(a.balance)}</strong></div></button><div id="acct-${a.id}" class="hidden" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">${tx}</div></div>`}).join('');let expenses=db.expenses.length?db.expenses.slice(0,20).map(e=>`<div class="list-card"><div class="list-row"><div><strong>${e.category}</strong><div class="meta">${new Date(e.date).toLocaleDateString()}</div></div><strong class="red">−${money(e.amount)}</strong></div></div>`).join(''):'<div class="empty">No expenses yet.</div>';document.getElementById('moneyList').innerHTML=`<div class="list-card"><div class="list-row"><strong>Total bank</strong><strong>${money(bankTotal())}</strong></div><div class="meta" style="margin-top:6px">All bank accounts combined</div></div>${accountsHtml}<div class="list-card"><div class="list-row"><strong>Cash</strong><strong>${money(db.cash)}</strong></div></div><div class="section-title"><span>Expenses</span></div>${expenses}`}
function renderAll(){renderDashboard();renderInventory();renderSales();renderCustomers();renderMoney()}
processRecurringSalary(); renderAll();
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>Carpet Business</title>
<link rel="manifest" href="manifest.json" />
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#2563eb;--good:#0f766e;--warn:#b45309;--danger:#b91c1c;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px;margin-top:2px}.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 3px 14px #1118270c;font-size:18px}.screen{padding:0 18px}.hero{background:linear-gradient(135deg,#111827,#293548);color:#fff;border-radius:26px;padding:23px;margin:8px 0 14px;box-shadow:0 12px 30px #11182722}.hero .label{opacity:.72;font-size:13px}.hero .amount{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin-top:7px}.hero .row{display:flex;justify-content:space-between;margin-top:20px;font-size:13px}.hero .row span:last-child{font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid #ffffff;border-radius:20px;padding:16px;box-shadow:0 5px 20px #11182708}.metric .title{font-size:12px;color:var(--muted)}.metric .value{font-size:21px;font-weight:800;margin-top:5px}.metric .tap{font-size:11px;color:var(--accent2);margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-weight:800}.link{color:var(--accent2);font-size:13px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 5px;font-size:11px;font-weight:700;color:var(--text)}.quick .ico{display:block;font-size:20px;margin-bottom:5px}.activity{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.dot{width:38px;height:38px;border-radius:13px;background:#eef2ff;display:grid;place-items:center}.grow{flex:1}.name{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.amt{font-weight:800;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav{background:none;color:var(--muted);font-size:10px;font-weight:700;padding:5px}.nav.active{color:var(--text)}.nav span{display:block;font-size:20px;margin-bottom:3px}.page{display:none}.page.active{display:block}.toolbar{display:flex;gap:9px;margin:12px 0}.search{flex:1;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px;outline:none}.primary{background:var(--accent);color:#fff;border-radius:14px;padding:12px 15px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:700}.list-card{background:#fff;border-radius:18px;padding:15px;margin:9px 0;border:1px solid var(--line)}.list-row{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:700;margin:5px 5px 0 0}.green{color:var(--good)}.red{color:var(--danger)}.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(540px,100%);margin:auto 0 0;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:20px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff}.actions{display:flex;gap:9px;margin-top:16px}.actions>*{flex:1}.empty{text-align:center;color:var(--muted);padding:30px 10px}.money{font-variant-numeric:tabular-nums}.hidden{display:none!important}@media(min-width:541px){body{padding-bottom:20px}.bottom{bottom:20px;border-radius:20px;width:520px;border:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Carpet Business</div><div class="sub">Business control center</div></div><button class="iconbtn" onclick="openModal('settings')">⚙️</button></div>
  <main class="screen">
    <section id="dashboard" class="page active">
      <div class="hero"><div class="label">Total business balance</div><div class="amount money" id="totalBalance">ETB 0</div><div class="row"><span>Updated automatically</span><span id="today"></span></div></div>
      <div class="grid">
        <button class="card metric" onclick="go('money')"><div class="title">🏦 Bank</div><div class="value money" id="bankTotal">ETB 0</div><div class="tap">View accounts →</div></button>
        <button class="card metric" onclick="go('money')"><div class="title">🧾 Supplier debt</div><div class="value money" id="debtTotal">ETB 0</div><div class="tap">View supplier debt →</div></button>
        <button class="card metric" onclick="go('customers')"><div class="title">🤝 Customer credit</div><div class="value money" id="creditTotal">ETB 0</div><div class="tap">View customers →</div></button>
        <button class="card metric" onclick="go('inventory')"><div class="title">📦 Inventory</div><div class="value money" id="inventoryValue">ETB 0</div><div class="tap">View stock →</div></button>
      </div>
      <div class="section-title"><span>Quick actions</span></div>
      <div class="quick"><button onclick="openModal('roll')"><span class="ico">📦</span>Add roll</button><button onclick="openModal('sale')"><span class="ico">🧾</span>Sale</button><button onclick="openModal('payment')"><span class="ico">💳</span>Payment</button><button onclick="openModal('expense')"><span class="ico">💸</span>Expense</button></div>
      <div class="section-title"><span>This month</span></div>
      <div class="grid"><div class="card metric"><div class="title">Sales</div><div class="value money" id="monthSales">ETB 0</div></div><div class="card metric"><div class="title">Gross profit</div><div class="value money" id="grossProfit">ETB 0</div></div><div class="card metric"><div class="title">Expenses</div><div class="value money" id="monthExpenses">ETB 0</div></div><div class="card metric"><div class="title">Net profit</div><div class="value money" id="netProfit">ETB 0</div></div></div>
      <div class="section-title"><span>Recent activity</span></div><div class="card" id="activity"></div>
    </section>

    <section id="inventory" class="page"><div class="section-title"><span>Inventory</span><button class="primary" onclick="openModal('roll')">+ Roll</button></div><div class="toolbar"><input id="inventorySearch" class="search" placeholder="Search design or color" oninput="renderInventory()"/></div><div id="inventoryList"></div></section>
    <section id="sales" class="page"><div class="section-title"><span>Sales</span><button class="primary" onclick="openModal('sale')">+ Sale</button></div><div id="salesList"></div></section>
    <section id="customers" class="page"><div class="section-title"><span>Customers</span><button class="primary" onclick="openModal('payment')">+ Payment</button></div><div id="customerList"></div></section>
    <section id="money" class="page"><div class="section-title"><span>Money</span><button class="primary" onclick="openModal('expense')">+ Expense</button></div><div id="moneyList"></div></section>
  </main>
  <nav class="bottom"><button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span>⌂</span>Home</button><button class="nav" data-page="inventory" onclick="go('inventory')"><span>▦</span>Inventory</button><button class="nav" data-page="sales" onclick="go('sales')"><span>▤</span>Sales</button><button class="nav" data-page="customers" onclick="go('customers')"><span>♙</span>Customers</button><button class="nav" data-page="money" onclick="go('money')"><span>₿</span>Money</button></nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='carpetBusinessMVP';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{rolls:[],sales:[],payments:[],expenses:[],accounts:[{id:'bank1',name:'Main Bank',balance:0}],cash:0,customers:{},recurringSalary:null,recurringCosts:[]}; db.recurringSalary=db.recurringSalary||null; db.salarySkippedMonths=db.salarySkippedMonths||[]; db.recurringCosts=db.recurringCosts||[]; db.suppliers=db.suppliers||{}; db.cash=0;
// Normalize early prototype records to the current m²-based model.
db.rolls.forEach(r=>{if(r.remainingArea==null) r.remainingArea=(r.remainingM??r.length)*r.width; if(r.area==null) r.area=r.length*r.width; if(r.costPerSqM==null&&r.cost!=null) r.costPerSqM=r.cost/(r.length*r.width);});
db.sales.forEach(s=>{if(s.areaM2==null&&s.meters!=null) s.areaM2=s.meters*4;});
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function money(n){return 'ETB '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function id(prefix){return prefix+Date.now()+Math.random().toString(16).slice(2,7)}
function month(d=new Date()){return d.toISOString().slice(0,7)}
function totalInventory(){return db.rolls.reduce((s,r)=>s+(r.remainingArea ?? r.length*r.width),0)}
function invValue(){return db.rolls.reduce((s,r)=>s+((r.remainingArea ?? r.length*r.width)*r.costPerSqM),0)}
function bankTotal(){return db.accounts.reduce((s,a)=>s+Number(a.balance||0),0)}
function creditTotal(){return Object.values(db.customers).reduce((s,c)=>s+Number(c.balance||0),0)}
function currentMonth(a){return a.date&&a.date.slice(0,7)===month()}
function salesMonth(){return db.sales.filter(currentMonth).reduce((s,x)=>s+x.total,0)}
function grossMonth(){return db.sales.filter(currentMonth).reduce((s,x)=>s+x.grossProfit,0)}
function expensesMonth(){return db.expenses.filter(currentMonth).reduce((s,x)=>s+x.amount,0)}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));renderAll();window.scrollTo(0,0)}
function openModal(type){const s=document.getElementById('sheet');let html='';
 if(type==='roll')html=`<h2>Add carpet roll</h2><div class="field"><label>Design code</label><input id="rDesign" placeholder="Niya / 136 / 137" oninput="checkDesignAvailability()"><div id="designStatus" class="meta" style="margin-top:6px"></div></div><div class="field"><label>Color</label><input id="rColor" placeholder="327 / F-106 / Red"></div><div class="field"><label>Length (meters)</label><input id="rLength" type="number" step="0.01" min="0.01" placeholder="42"></div><div class="field"><label>Purchase cost per m² (ETB)</label><input id="rCost" type="number" step="0.01" min="0.01" placeholder="1400"></div><div class="field"><label>Width (meters)</label><input id="rWidth" type="number" step="0.01" value="4" readonly></div><div class="field"><label>Purchase payment</label><select id="rAccount" onchange="toggleRollPayment()"><option value="bank:${db.accounts[0]?.id||''}">${db.accounts[0]?.name||'Bank'}</option>${db.accounts.slice(1).map(a=>`<option value="bank:${a.id}">${a.name}</option>`).join('')}<option value="supplier_credit">Supplier credit</option></select></div><div id="supplierCreditFields" class="hidden"><div class="field"><label>Supplier</label><input id="rSupplier" placeholder="Supplier name"></div><div class="field"><label>Due date</label><input id="rDueDate" type="date"></div></div><div id="rollTotal" class="card" style="margin-top:12px;background:#f8fafc"><div class="meta">Purchase total</div><strong id="rollTotalValue">ETB 0</strong></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button id="saveRollBtn" class="primary" onclick="addRoll()">Save roll</button></div>`;
 if(type==='sale')html=`<h2>Record sale</h2><div class="field"><label>Customer</label><input id="sCustomer" placeholder="Customer name"></div><div class="field"><label>Design code</label><input id="sDesign" placeholder="D105"></div><div class="field"><label>Color</label><input id="sColor" placeholder="Beige"></div><div class="field"><label>m² sold</label><input id="sMeters" type="number" step="0.01"></div><div class="field"><label>Selling price / m²</label><input id="sPrice" type="number" step="0.01"></div><div class="field"><label>Payment</label><select id="sPayment"><option value="credit">Customer credit</option><option value="bank">Bank transfer</option></select></div><div class="field" id="accountField"><label>Bank account</label><select id="sAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addSale()">Save sale</button></div>`;
 if(type==='payment')html=`<h2>Customer payment</h2><div class="field"><label>Customer</label><select id="pCustomer">${Object.keys(db.customers).length?Object.values(db.customers).map(c=>`<option value="${c.name}">${c.name} — ${money(c.balance)}</option>`).join(''):'<option>No credit customers yet</option>'}</select></div><div class="field"><label>Amount</label><input id="pAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="pAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addPayment()">Record payment</button></div>`;
 if(type==='supplierPayment')html=`<h2>Pay supplier</h2><div class="field"><label>Supplier</label><select id="spSupplier">${Object.values(db.suppliers||{}).filter(x=>x.balance>0).map(x=>`<option value="${x.name}">${x.name} — ${money(x.balance)}</option>`).join('')||'<option>No supplier debt yet</option>'}</select></div><div class="field"><label>Amount</label><input id="spAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="spAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="paySupplier()">Record payment</button></div>`;
 if(type==='expense')html=`<h2>Add cost</h2>
<div class="field"><label>Cost type</label><select id="eCat" onchange="toggleCustomCost()"><option>Salary</option><option>Labor</option><option>Transportation</option><option>Rent</option><option>Utilities</option><option>Marketing</option><option>Repairs</option><option>Other</option><option value="__custom">+ New type</option></select></div>
<div class="field hidden" id="customCostField"><label>New cost type</label><input id="eCustomCat" placeholder="e.g. Warehouse"></div>
<div class="field"><label>Amount</label><input id="eAmount" type="number" step="0.01" min="0"></div>
<div class="field"><label>Paid from bank</label><select id="eAccount">${db.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
<div class="field"><label>Schedule</label><select id="eRecurring" onchange="toggleRecurringFields()"><option value="once">One-time</option><option value="recurring">Recurring</option></select></div>
<div id="recurringFields" class="hidden">
<div class="field"><label>Frequency</label><select id="eFrequency"><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select></div>
<div class="field"><label>First due date</label><input id="eStartDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="meta">The app records the cost when you open it on or after each due date.</div>
</div>
<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addExpense()">Save cost</button></div>`;
 if(type==='settings')html=`<h2>Settings</h2><div class="field"><label>Bank accounts</label>${db.accounts.map(a=>`<div class="list-card"><div class="list-row"><div><strong>${a.name}</strong><div class="meta">${money(a.balance)}</div></div><button class="secondary" style="padding:8px 11px" onclick="renameBank('${a.id}')">Rename</button></div></div>`).join('')}</div><div class="field"><label>Monthly salary</label><input id="salaryAmount" type="number" step="0.01" value="${db.recurringSalary?.amount||''}" placeholder="0"></div><div class="field"><label>Salary paid from</label><select id="salaryAccount">${db.accounts.map(a=>`<option value="${a.id}" ${db.recurringSalary?.source===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button class="secondary" onclick="saveSalary()">Save salary</button><button class="primary" onclick="addBank()">+ Bank account</button><button class="secondary" onclick="openModal('supplierPayment')">Pay supplier</button></div>`;
 s.innerHTML=html;document.getElementById('modal').classList.add('show');if(type==='sale')togglePay();if(type==='roll'){const updateRollTotal=()=>{const len=+document.getElementById('rLength').value||0;const cost=+document.getElementById('rCost').value||0;document.getElementById('rollTotalValue').textContent=money(len*4*cost)};document.getElementById('rLength').addEventListener('input',updateRollTotal);document.getElementById('rCost').addEventListener('input',updateRollTotal);updateRollTotal();toggleRollPayment();}}
function toggleRollPayment(){const el=document.getElementById('rAccount'),f=document.getElementById('supplierCreditFields');if(el&&f)f.classList.toggle('hidden',el.value!=='supplier_credit')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function checkDesignAvailability(){const design=rDesign.value.trim();const el=document.getElementById('designStatus'),btn=document.getElementById('saveRollBtn');if(!design){el.textContent='Design code can be used on multiple rolls.';btn.disabled=false;return}const count=db.rolls.filter(r=>r.design.trim().toLowerCase()===design.toLowerCase()&&(r.remainingArea??r.length*r.width)>0.000001).length;el.textContent=count?`✓ ${design} already has ${count} roll${count===1?'':'s'} in stock. You can add another roll.`:`✓ ${design} is new.`;btn.disabled=false}

function addRoll(){const design=rDesign.value.trim(),color=rColor.value.trim(),length=+rLength.value,costPerSqM=+rCost.value,width=4,choice=rAccount.value;const area=length*width,total=area*costPerSqM;if(!design||!color||!length||!costPerSqM)return alert('Please complete design, color, length and purchase cost per m².');let paymentSource=choice,supplier=null;if(choice==='supplier_credit'){supplier=document.getElementById('rSupplier')?.value.trim();const due=document.getElementById('rDueDate')?.value;if(!supplier||!due)return alert('Enter supplier and due date.');if(!db.suppliers[supplier])db.suppliers[supplier]={name:supplier,balance:0,payments:[]};db.suppliers[supplier].balance+=total;paymentSource='supplier_credit'}else{const aid=choice.replace('bank:','');const a=db.accounts.find(x=>x.id===aid);if(!a||a.balance<total)return alert(`Not enough bank balance. Purchase total is ${money(total)}.`);a.balance-=total}db.rolls.push({id:id('R'),design,color,length,width,area,remainingArea:area,costPerSqM,purchaseTotal:total,paymentSource:paymentSource,bankAccountId:choice.startsWith('bank:')?choice.replace('bank:',''):null,supplier, supplierDue:document.getElementById('rDueDate')?.value||null,date:new Date().toISOString()});closeModal();save()}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function openDesignInventory(dk){inventoryDesignOpen=inventoryDesignOpen===dk?null:dk; inventoryColorOpen=null; renderInventory();}
function openColorInventory(dk,ck){const key=dk+'|'+ck; inventoryColorOpen=inventoryColorOpen===key?null:key; renderInventory();}

function renderSales(){document.getElementById('salesList').innerHTML=db.sales.length?db.sales.map(s=>`<div class="list-card"><div class="list-row"><div><strong>${s.design} · ${s.color}</strong><div class="meta">${s.customer} · ${new Date(s.date).toLocaleDateString()}</div></div><strong>${money(s.total)}</strong></div><div><span class="pill">${s.areaM2.toFixed(2)} m²</span><span class="pill">${money(s.price)}/m²</span><span class="pill">${s.payment}</span><span class="pill green">Gross ${money(s.grossProfit)}</span></div><button class="secondary" style="margin-top:10px;color:var(--danger);width:100%" onclick="voidSale('${s.id}')">Void sale</button></div>`).join(''):'<div class="empty">No sales yet.</div>'}
function renderCustomers(){const cs=Object.values(db.customers).filter(c=>c.balance>0);document.getElementById('customerList').innerHTML=cs.length?cs.map(c=>`<div class="list-card"><div class="list-row"><div><strong>${c.name}</strong><div class="meta">Outstanding credit</div></div><strong class="red">${money(c.balance)}</strong></div></div>`).join(''):'<div class="empty">No outstanding customer credit.</div>'}
function renderMoney(){let accountsHtml=db.accounts.map(a=>{const rows=accountActivity(a.id);let tx=rows.length?rows.map(r=>`<div class="activity"><div class="dot">${r.dir==='in'?'↗️':'↘️'}</div><div class="grow"><div class="name">${r.type}</div><div class="meta">${r.name} · ${new Date(r.date).toLocaleDateString()}</div></div><div class="amt ${r.dir==='in'?'green':'red'}">${r.dir==='in'?'+':'−'}${money(r.amount)}</div></div>`).join(''):'<div class="empty" style="padding:18px">No transactions yet.</div>';return `<div class="list-card"><button style="width:100%;background:none;text-align:left;padding:0" onclick="toggleAccount('${a.id}')"><div class="list-row"><div><strong>${a.name}</strong><div class="meta">Bank account · tap for transactions</div></div><strong>${money(a.balance)}</strong></div></button><div id="acct-${a.id}" class="hidden" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">${tx}</div></div>`}).join('');let payments=db.payments.length?db.payments.slice(0,20).map(p=>`<div class="list-card"><div class="list-row"><div><strong>Customer payment</strong><div class="meta">${p.customer} · ${p.account} · ${new Date(p.date).toLocaleDateString()}</div></div><strong class="green">+${money(p.amount)}</strong></div><button class="secondary" style="margin-top:9px;color:var(--danger);width:100%" onclick="deletePayment('${p.id}')">Delete payment</button></div>`).join(''):'<div class="empty">No customer payments yet.</div>';let expenses=db.expenses.length?db.expenses.slice(0,20).map(e=>`<div class="list-card"><div class="list-row"><div><strong>${e.category}</strong><div class="meta">${new Date(e.date).toLocaleDateString()} · ${db.accounts.find(a=>a.id===e.source)?.name||'Bank'}</div></div><strong class="red">−${money(e.amount)}</strong></div><button class="secondary" style="margin-top:9px;color:var(--danger);width:100%" onclick="deleteExpense('${e.id}')">Delete expense</button></div>`).join(''):'<div class="empty">No expenses yet.</div>';let recurring=db.recurringCosts||[];let recurringHtml=recurring.length?recurring.map(r=>`<div class="list-card"><div class="list-row"><div><strong>${r.category}</strong><div class="meta">${money(r.amount)} · ${r.frequency} · next ${new Date(r.nextDue+'T00:00:00').toLocaleDateString()} · ${r.active?'Active':'Paused'}</div></div></div><div class="actions" style="margin-top:9px"><button class="secondary" onclick="pauseRecurringCost('${r.id}')">${r.active?'Pause':'Resume'}</button><button class="secondary" style="color:var(--danger)" onclick="deleteRecurringCost('${r.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No recurring costs yet.</div>';let debts=Object.values(db.suppliers||{}).filter(x=>x.balance>0);let debtHtml=debts.length?debts.map(d=>`<div class="list-card"><div class="list-row"><div><strong>${escapeHtml(d.name)}</strong><div class="meta">Outstanding supplier debt</div></div><strong class="red">${money(d.balance)}</strong></div>${d.payments?.length?`<div class="meta" style="margin-top:8px">Last payment: ${money(d.payments[0].amount)} · ${new Date(d.payments[0].date).toLocaleDateString()}</div>`:''}</div>`).join(''):'<div class="empty">No supplier debt.</div>';document.getElementById('moneyList').innerHTML=`<div class="list-card"><div class="list-row"><strong>Total bank</strong><strong>${money(bankTotal())}</strong></div><div class="meta" style="margin-top:6px">All bank accounts combined</div></div><div class="section-title"><span>Bank accounts</span><button class="link" onclick="openModal('settings')">Manage</button></div>${accountsHtml}<div class="section-title"><span>Supplier debt</span><button class="primary" onclick="openModal('supplierPayment')">Pay supplier</button></div>${debtHtml}<div class="section-title"><span>Customer payments</span></div>${payments}<div class="section-title"><span>Expenses</span></div>${expenses}<div class="section-title"><span>Recurring costs</span></div>${recurringHtml}`}
function renderAll(){renderDashboard();renderInventory();renderSales();renderCustomers();renderMoney()}
processRecurringSalary(); processRecurringCosts(); renderAll();
</script>

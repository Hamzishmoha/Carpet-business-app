<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Carpet Business</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--blue:#2563eb;--good:#047857;--danger:#b91c1c;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:850}.sub,.meta,.hint{color:var(--muted);font-size:12px}.iconbtn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 15px #1118270d}.screen{padding:0 18px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:25px;padding:22px;margin:8px 0 14px}.hero .label{opacity:.72;font-size:13px}.hero .amount{font-size:33px;font-weight:850;margin-top:5px}.hero .row{display:flex;justify-content:space-between;margin-top:18px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.list-card{background:#fff;border:1px solid #fff;border-radius:19px;padding:15px;box-shadow:0 5px 20px #11182708}.metric{text-align:left}.metric .title{font-size:12px;color:var(--muted)}.metric .value{font-size:20px;font-weight:850;margin-top:5px}.metric .tap{font-size:11px;color:var(--blue);margin-top:7px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:21px 0 10px;font-weight:850}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 4px;font-size:11px;font-weight:750}.quick .ico{display:block;font-size:20px;margin-bottom:4px}.toolbar{display:flex;gap:8px;margin:10px 0}.search{flex:1;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}.primary,.secondary,.danger{border-radius:13px;padding:11px 14px;font-weight:800;border:0}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:750}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--text)}.list-card{margin:9px 0}.list-row{display:flex;justify-content:space-between;gap:12px}.pill{display:inline-flex;background:#f3f4f6;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;margin:6px 4px 0 0}.green{color:var(--good)}.red{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:28px 10px}.money{font-variant-numeric:tabular-nums}.modal{position:fixed;z-index:30;inset:0;background:#11182766;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:19px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px;font-size:20px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:0}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.hidden{display:none!important}.notice{background:#f8fafc;border-radius:13px;padding:11px;font-size:12px;color:#475569;margin:9px 0}.report{background:#fff;padding:18px;border-radius:18px}.report h2{margin:0 0 8px}.report-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.report-total{font-weight:850}.subhead{font-weight:850;margin:16px 0 8px}.status{font-size:11px;color:var(--good);font-weight:700}
@media print{body{background:#fff}.app{max-width:none;padding:0}.top,.bottom,.no-print{display:none!important}.page{display:none!important}#report{display:block!important}.report{box-shadow:none}.screen{padding:0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Carpet Business</div><div class="sub">Business control center</div></div><button class="iconbtn" onclick="openModal('settings')">⚙️</button></header>
<main class="screen">
<section id="dashboard" class="page active">
<div class="hero"><div class="label">Total business balance</div><div class="amount money" id="totalBalance">ETB 0</div><div class="row"><span>Bank + Customer Credit + Inventory − Supplier Debt</span><span id="saveStatus">Saved locally</span></div></div>
<div class="grid">
<button class="card metric" onclick="go('money')"><div class="title">🏦 Bank</div><div class="value money" id="bankTotal">ETB 0</div><div class="tap">Accounts →</div></button>
<button class="card metric" onclick="go('money');setTimeout(()=>document.getElementById('supplierSection')?.scrollIntoView(),50)"><div class="title">🏭 Supplier debt</div><div class="value money" id="supplierDebt">ETB 0</div><div class="tap">Suppliers →</div></button>
<button class="card metric" onclick="go('customers')"><div class="title">🤝 Customer credit</div><div class="value money" id="customerCredit">ETB 0</div><div class="tap">Customers →</div></button>
<button class="card metric" onclick="go('inventory')"><div class="title">📦 Inventory</div><div class="value money" id="inventoryValue">ETB 0</div><div class="tap">Stock →</div></button>
</div>
<div class="section-title"><span>Quick actions</span></div><div class="quick"><button onclick="openModal('roll')"><span class="ico">📦</span>Add roll</button><button onclick="openModal('sale')"><span class="ico">🧾</span>Sale</button><button onclick="openModal('payment')"><span class="ico">💳</span>Payment</button><button onclick="openModal('expense')"><span class="ico">💸</span>Expense</button></div>
<div class="section-title"><span>This month</span><button class="secondary" onclick="go('report')">Report</button></div><div class="grid"><div class="card metric"><div class="title">Sales</div><div class="value money" id="monthSales">ETB 0</div></div><div class="card metric"><div class="title">Gross profit</div><div class="value money" id="monthGross">ETB 0</div></div><div class="card metric"><div class="title">Expenses</div><div class="value money" id="monthExpenses">ETB 0</div></div><div class="card metric"><div class="title">Net profit</div><div class="value money" id="monthNet">ETB 0</div></div></div>
<div class="section-title">Recent activity</div><div class="card" id="activity"></div>
</section>
<section id="inventory" class="page"><div class="section-title"><span>Inventory</span><button class="primary" onclick="openModal('roll')">+ Roll</button></div><div class="toolbar"><input id="inventorySearch" class="search" placeholder="Search design or color" oninput="renderInventory()"></div><div id="inventoryList"></div></section>
<section id="sales" class="page"><div class="section-title"><span>Sales</span><button class="primary" onclick="openModal('sale')">+ Sale</button></div><div id="salesList"></div></section>
<section id="customers" class="page"><div class="section-title"><span>Customers</span><button class="primary" onclick="openModal('payment')">+ Payment</button></div><div id="customerList"></div></section>
<section id="money" class="page"><div class="section-title"><span>Money</span><button class="primary" onclick="openModal('expense')">+ Expense</button></div><div id="moneyList"></div></section>
<section id="report" class="page"><div class="section-title"><span>Monthly summary</span><button class="primary" onclick="printReport()">Print / PDF</button></div><div class="toolbar"><input id="reportMonth" type="month" class="search" onchange="renderReport()"></div><div id="reportBody"></div></section>
</main>
<nav class="bottom"><button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span>⌂</span>Home</button><button class="nav" data-page="inventory" onclick="go('inventory')"><span>▦</span>Inventory</button><button class="nav" data-page="sales" onclick="go('sales')"><span>▤</span>Sales</button><button class="nav" data-page="customers" onclick="go('customers')"><span>♙</span>Customers</button><button class="nav" data-page="money" onclick="go('money')"><span>₿</span>Money</button></nav>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='carpetBusinessFinalV1';
const blank=()=>({version:1,rolls:[],sales:[],customerPayments:[],supplierDebts:[],supplierPayments:[],expenses:[],recurringCosts:[],accounts:[],customers:{},activity:[]});
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.version)return normalize(x)}catch(e){} const x=blank();x.accounts=[{id:uid('acct'),name:'Main Bank',openingBalance:0}];return x}
function normalize(x){const b=Object.assign(blank(),x);b.accounts=b.accounts||[{id:uid('acct'),name:'Main Bank',openingBalance:0}];b.rolls=b.rolls||[];b.sales=b.sales||[];b.customerPayments=b.customerPayments||b.payments||[];b.supplierDebts=b.supplierDebts||[];b.supplierPayments=b.supplierPayments||[];b.expenses=b.expenses||[];b.recurringCosts=b.recurringCosts||[];b.customers=b.customers||{};return b}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveStatus').textContent='Saved locally';renderAll()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return 'ETB '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function num(v){return Number(v)||0}
function iso(d=new Date()){const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function ym(d){return String(d||'').slice(0,7)}
function accountBalance(aid){const a=db.accounts.find(x=>x.id===aid);if(!a)return 0;let b=num(a.openingBalance);db.sales.filter(s=>s.paymentType==='bank'&&s.accountId===aid&&!s.voided).forEach(s=>b+=num(s.total));db.customerPayments.filter(p=>p.accountId===aid&&!p.voided).forEach(p=>b+=num(p.amount));db.supplierPayments.filter(p=>p.accountId===aid&&!p.voided).forEach(p=>b-=num(p.amount));db.expenses.filter(e=>e.accountId===aid&&!e.voided).forEach(e=>b-=num(e.amount));db.rolls.filter(r=>r.purchaseType==='bank'&&r.accountId===aid&&!r.voided).forEach(r=>b-=num(r.purchaseTotal));return b}
function bankTotal(){return db.accounts.reduce((s,a)=>s+accountBalance(a.id),0)}
function rollArea(r){return Math.max(0,num(r.remainingM2))}
function inventoryM2(){return db.rolls.filter(r=>!r.voided).reduce((s,r)=>s+rollArea(r),0)}
function inventoryValue(){return db.rolls.filter(r=>!r.voided).reduce((s,r)=>s+rollArea(r)*num(r.costPerM2),0)}
function customerBalance(name){return num(db.customers[name]?.balance)}
function customerCredit(){return Object.values(db.customers).reduce((s,c)=>s+Math.max(0,num(c.balance)),0)}
function supplierDebt(){return db.supplierDebts.filter(d=>!d.voided).reduce((s,d)=>s+Math.max(0,num(d.amount)-supplierPaid(d.id)),0)}
function supplierPaid(id){return db.supplierPayments.filter(p=>p.debtId===id&&!p.voided).reduce((s,p)=>s+num(p.amount),0)}
function businessBalance(){return bankTotal()+customerCredit()+inventoryValue()-supplierDebt()}
function monthSales(m){return db.sales.filter(s=>!s.voided&&ym(s.date)===m).reduce((s,x)=>s+num(x.total),0)}
function monthGross(m){return db.sales.filter(s=>!s.voided&&ym(s.date)===m).reduce((s,x)=>s+num(x.grossProfit),0)}
function monthExpenses(m){return db.expenses.filter(e=>!e.voided&&ym(e.date)===m).reduce((s,x)=>s+num(x.amount),0)}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='report')renderReport();window.scrollTo(0,0)}
function renderAll(){renderDashboard();renderInventory();renderSales();renderCustomers();renderMoney();renderReport()}
function renderDashboard(){const m=iso().slice(0,7);document.getElementById('totalBalance').textContent=money(businessBalance());document.getElementById('bankTotal').textContent=money(bankTotal());document.getElementById('supplierDebt').textContent=money(supplierDebt());document.getElementById('customerCredit').textContent=money(customerCredit());document.getElementById('inventoryValue').textContent=money(inventoryValue());document.getElementById('monthSales').textContent=money(monthSales(m));document.getElementById('monthGross').textContent=money(monthGross(m));document.getElementById('monthExpenses').textContent=money(monthExpenses(m));document.getElementById('monthNet').textContent=money(monthGross(m)-monthExpenses(m));document.getElementById('activity').innerHTML=recentActivity()||'<div class="empty">No activity yet.</div>'}
function recentActivity(){const a=[];db.sales.filter(s=>!s.voided).forEach(s=>a.push({date:s.date,icon:'🧾',name:'Sale · '+s.design+' / '+s.color,meta:s.customer+' · '+s.areaM2.toFixed(2)+' m²',amount:s.total,dir:'in'}));db.customerPayments.filter(p=>!p.voided).forEach(p=>a.push({date:p.date,icon:'💳',name:'Customer payment · '+p.customer,meta:'Bank',amount:p.amount,dir:'in'}));db.supplierPayments.filter(p=>!p.voided).forEach(p=>a.push({date:p.date,icon:'🏭',name:'Supplier payment · '+p.supplier,meta:'Bank',amount:p.amount,dir:'out'}));db.expenses.filter(e=>!e.voided).forEach(e=>a.push({date:e.date,icon:'💸',name:'Expense · '+e.category,meta:'Bank',amount:e.amount,dir:'out'}));return a.sort((x,y)=>new Date(y.date)-new Date(x.date)).slice(0,7).map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><div style="width:36px;height:36px;border-radius:12px;background:#eef2ff;display:grid;place-items:center">${x.icon}</div><div style="flex:1"><strong style="font-size:13px">${esc(x.name)}</strong><div class="meta">${esc(x.meta)} · ${new Date(x.date).toLocaleDateString()}</div></div><strong class="${x.dir==='in'?'green':'red'}">${x.dir==='in'?'+':'−'}${money(x.amount)}</strong></div>`).join('')}
let openDesign=null,openColor=null,openCustomer=null;
function renderInventory(){const q=(document.getElementById('inventorySearch')?.value||'').toLowerCase();const ds={};db.rolls.filter(r=>!r.voided&&rollArea(r)>0).forEach(r=>{const d=r.design.trim(),dk=d.toLowerCase(),c=r.color.trim(),ck=c.toLowerCase();if(!ds[dk])ds[dk]={design:d,area:0,value:0,colors:{}};ds[dk].area+=rollArea(r);ds[dk].value+=rollArea(r)*num(r.costPerM2);if(!ds[dk].colors[ck])ds[dk].colors[ck]={color:c,area:0,rolls:[]};ds[dk].colors[ck].area+=rollArea(r);ds[dk].colors[ck].rolls.push(r)});let arr=Object.values(ds).filter(d=>(d.design+' '+Object.values(d.colors).map(c=>c.color).join(' ')).toLowerCase().includes(q));const el=document.getElementById('inventoryList');if(!arr.length){el.innerHTML='<div class="empty">No inventory yet.</div>';return}el.innerHTML=arr.sort((a,b)=>a.design.localeCompare(b.design)).map(d=>{const dk=d.design.toLowerCase(),op=openDesign===dk;return `<div class="list-card"><button style="width:100%;background:none;border:0;text-align:left;padding:0" onclick="toggleDesign('${esc(dk)}')"><div class="list-row"><div><strong>${esc(d.design)}</strong><div class="meta">${Object.keys(d.colors).length} color(s)</div></div><div style="text-align:right"><strong>${d.area.toFixed(2)} m²</strong><div class="meta">${money(d.value)}</div></div></div></button>${op?Object.values(d.colors).sort((a,b)=>a.color.localeCompare(b.color)).map(c=>{const ck=c.color.toLowerCase(),cop=openColor===dk+'|'+ck;return `<div style="margin-top:9px;padding:10px;border-top:1px solid var(--line)"><button style="width:100%;background:none;border:0;text-align:left;padding:0" onclick="toggleColor('${esc(dk)}','${esc(ck)}')"><div class="list-row"><div><strong>${esc(c.color)}</strong><div class="meta">${c.rolls.length} roll(s)</div></div><strong>${c.area.toFixed(2)} m²</strong></div></button>${cop?c.rolls.map(r=>`<div style="margin-top:8px;background:#f8fafc;border-radius:12px;padding:9px"><div class="list-row"><div><strong>Roll ${esc(r.rollId)}</strong><div class="meta">${num(r.lengthM).toFixed(2)} m · ${money(r.costPerM2)}/m²</div></div><div style="text-align:right"><strong>${rollArea(r).toFixed(2)} m²</strong><br><button class="danger" style="padding:5px 8px;margin-top:4px;font-size:11px" onclick="deleteRoll('${r.id}')">Delete</button></div></div></div>`).join(''):''}</div>`}).join(''):''}</div>`}).join('')}
function toggleDesign(d){openDesign=openDesign===d?null:d;openColor=null;renderInventory()}function toggleColor(d,c){const k=d+'|'+c;openColor=openColor===k?null:k;renderInventory()}function toggleCustomer(n){openCustomer=openCustomer===n?null:n;renderCustomers()}
function renderSales(){const el=document.getElementById('salesList');const a=db.sales.slice().sort((x,y)=>new Date(y.date)-new Date(x.date));el.innerHTML=a.length?a.map(s=>`<div class="list-card"><div class="list-row"><div><strong>${esc(s.design)} · ${esc(s.color)}</strong><div class="meta">${esc(s.customer)} · ${new Date(s.date).toLocaleDateString()}</div></div><strong>${money(s.total)}</strong></div><span class="pill">${s.areaM2.toFixed(2)} m²</span><span class="pill">${money(s.pricePerM2)}/m²</span><span class="pill">${s.paymentType==='bank'?'Bank':'Customer Credit'}</span><span class="pill ${s.voided?'red':'green'}">${s.voided?'Voided':'Gross '+money(s.grossProfit)}</span>${!s.voided?`<button class="danger" style="width:100%;margin-top:9px" onclick="voidSale('${s.id}')">Void sale & restore inventory</button>`:''}</div>`).join(''):'<div class="empty">No sales yet.</div>'}
function renderCustomers(){const names=new Set(Object.keys(db.customers));db.customerPayments.forEach(p=>names.add(p.customer));db.sales.forEach(s=>names.add(s.customer));const el=document.getElementById('customerList');const a=[...names].map(n=>({name:n,balance:customerBalance(n)})).filter(x=>x.balance!==0||db.sales.some(s=>s.customer===x.name)||db.customerPayments.some(p=>p.customer===x.name));el.innerHTML=a.length?a.sort((x,y)=>x.name.localeCompare(y.name)).map(c=>{const op=openCustomer===c.name;const sales=db.sales.filter(s=>s.customer===c.name);const pays=db.customerPayments.filter(p=>p.customer===c.name&&!p.voided);const history=[...sales.map(s=>({date:s.date,label:'Sale · '+s.design+' / '+s.color,detail:s.areaM2.toFixed(2)+' m² · '+money(s.total),kind:'sale'})),...pays.map(p=>({date:p.date,label:'Payment received',detail:money(p.amount),kind:'pay'}))].sort((x,y)=>new Date(y.date)-new Date(x.date));return `<div class="list-card"><button style="width:100%;background:none;border:0;text-align:left;padding:0" onclick="toggleCustomer('${esc(c.name)}')"><div class="list-row"><div><strong>${esc(c.name)}</strong><div class="meta">Customer ledger · ${sales.filter(s=>!s.voided).length} sale(s)</div></div><strong class="${c.balance>0?'red':'green'}">${money(c.balance)}</strong></div><div class="meta" style="margin-top:6px">${c.balance>0?'Outstanding receivable':'No outstanding balance'}</div></button>${op?`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">${history.length?history.map(h=>`<div class="list-row" style="padding:7px 0"><div><strong style="font-size:12px">${esc(h.label)}</strong><div class="meta">${new Date(h.date).toLocaleDateString()}</div></div><span class="${h.kind==='sale'?'red':'green'}">${h.kind==='sale'?'−':'+'}${h.detail}</span></div>`).join(''):'<div class="empty">No ledger entries.</div>'}</div>`:''}</div>`}).join(''):'<div class="empty">No customer credit yet.</div>'}
function renderMoney(){const el=document.getElementById('moneyList');const accounts=db.accounts.map(a=>`<div class="list-card"><div class="list-row"><div><strong>${esc(a.name)}</strong><div class="meta">Opening ${money(a.openingBalance)}</div></div><strong>${money(accountBalance(a.id))}</strong></div><div class="actions"><button class="secondary" onclick="openModal('editAccount','${a.id}')">Edit</button><button class="danger" onclick="deleteAccount('${a.id}')">Delete</button></div></div>`).join('');const expenses=db.expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`<div class="list-card"><div class="list-row"><div><strong>${esc(e.category)}</strong><div class="meta">${new Date(e.date).toLocaleDateString()} · ${esc(e.note||'')}</div></div><strong class="red">−${money(e.amount)}</strong></div>${!e.voided?`<button class="danger" style="margin-top:8px;width:100%" onclick="deleteExpense('${e.id}')">Delete expense</button>`:'<span class="pill red">Voided</span>'}</div>`).join('')||'<div class="empty">No expenses yet.</div>';const cps=db.customerPayments.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>`<div class="list-card"><div class="list-row"><div><strong>Customer payment</strong><div class="meta">${esc(p.customer)} · ${new Date(p.date).toLocaleDateString()}</div></div><strong class="green">+${money(p.amount)}</strong></div>${!p.voided?`<button class="danger" style="margin-top:8px;width:100%" onclick="deleteCustomerPayment('${p.id}')">Delete payment</button>`:''}</div>`).join('')||'<div class="empty">No customer payments.</div>';const sps=db.supplierPayments.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>`<div class="list-card"><div class="list-row"><div><strong>Supplier payment</strong><div class="meta">${esc(p.supplier)} · ${new Date(p.date).toLocaleDateString()}</div></div><strong class="red">−${money(p.amount)}</strong></div>${!p.voided?`<button class="danger" style="margin-top:8px;width:100%" onclick="deleteSupplierPayment('${p.id}')">Delete payment</button>`:''}</div>`).join('')||'<div class="empty">No supplier payments.</div>';const debts=db.supplierDebts.filter(d=>!d.voided).map(d=>{const rem=num(d.amount)-supplierPaid(d.id);return `<div class="list-card"><div class="list-row"><div><strong>${esc(d.supplier)}</strong><div class="meta">${esc(d.invoice||'No invoice')} · due ${d.dueDate?new Date(d.dueDate+'T00:00').toLocaleDateString():'—'}</div></div><strong class="${rem>0?'red':'green'}">${money(rem)}</strong></div><div class="meta" style="margin-top:6px">Original ${money(d.amount)} · Paid ${money(supplierPaid(d.id))}</div>${rem>0?`<button class="secondary" style="margin-top:8px;width:100%" onclick="openModal('supplierPayment','${d.id}')">Pay supplier</button>`:''}</div>`}).join('')||'<div class="empty">No supplier debt.</div>';const rec=(db.recurringCosts||[]).map(r=>`<div class="list-card"><div class="list-row"><div><strong>${esc(r.category)}</strong><div class="meta">${money(r.amount)} · ${r.frequency} · next ${new Date(r.nextDue+'T00:00').toLocaleDateString()}</div></div><span class="pill">${r.active?'Active':'Paused'}</span></div><div class="actions"><button class="secondary" onclick="toggleRecurring('${r.id}')">${r.active?'Pause':'Resume'}</button><button class="danger" onclick="deleteRecurring('${r.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No recurring costs.</div>';

function openModal(type,id){let h='';if(type==='roll')h=`<h2>Add carpet roll</h2><div class="notice">Width is fixed at 4 m. Enter the physical roll length from its sticker.</div><div class="field"><label>Design</label><input id="fDesign" list="designChoices" placeholder="Select existing or enter new"><datalist id="designChoices">${[...new Set(db.rolls.filter(r=>!r.voided).map(r=>r.design))].sort().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label>Color</label><input id="fColor" list="colorChoices" placeholder="Select existing or enter new"><datalist id="colorChoices">${[...new Set(db.rolls.filter(r=>!r.voided).map(r=>r.color))].sort().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label>Length (m)</label><input id="fLength" type="number" step="0.01"></div><div class="field"><label>Cost per m²</label><input id="fCost" type="number" step="0.01"></div><div class="field"><label>Purchase type</label><select id="fPurchase" onchange="document.getElementById('purchaseBank').classList.toggle('hidden',this.value!=='bank');document.getElementById('purchaseSupplier').classList.toggle('hidden',this.value!=='credit')"><option value="credit">Supplier credit</option><option value="bank">Paid from bank</option></select></div><div id="purchaseBank" class="hidden"><div class="field"><label>Bank account</label><select id="fBank">${accountOptions()}</select></div></div><div id="purchaseSupplier"><div class="field"><label>Supplier</label><input id="fSupplier" placeholder="Supplier name"></div><div class="field"><label>Invoice / reference</label><input id="fInvoice"></div><div class="field"><label>Due date</label><input id="fDue" type="date"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addRoll()">Save roll</button></div>`;

else if(type==='payment')h=`<h2>Receive customer payment</h2><div class="field"><label>Customer</label><input id="pCustomer" placeholder="Customer name"></div><div class="field"><label>Amount</label><input id="pAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="pBank">${accountOptions()}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addCustomerPayment()">Save payment</button></div>`;
else if(type==='supplierPayment')h=`<h2>Pay supplier</h2><div class="notice">${esc(db.supplierDebts.find(x=>x.id===id)?.supplier||'Supplier')} · Remaining ${money(num(db.supplierDebts.find(x=>x.id===id)?.amount)-supplierPaid(id))}</div><input type="hidden" id="spDebt" value="${id}"><div class="field"><label>Amount</label><input id="spAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="spBank">${accountOptions()}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addSupplierPayment()">Save payment</button></div>`;
else if(type==='expense')h=`<h2>Record expense</h2><div class="field"><label>Expense type</label><input id="eCategory" placeholder="Transport, salary, rent, etc."></div><div class="field"><label>Amount</label><input id="eAmount" type="number" step="0.01"></div><div class="field"><label>Date</label><input id="eDate" type="date" value="${iso()}"></div><div class="field"><label>Bank account</label><select id="eBank">${accountOptions()}</select></div><div class="field"><label>Note</label><input id="eNote"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addExpense()">Save expense</button></div>`;
else if(type==='account'||type==='editAccount'){const a=id?db.accounts.find(x=>x.id===id):null;h=`<h2>${a?'Edit bank account':'Add bank account'}</h2><div class="field"><label>Bank name</label><input id="aName" value="${esc(a?.name||'')}"></div><div class="field"><label>Opening balance</label><input id="aOpening" type="number" step="0.01" value="${a?num(a.openingBalance):0}"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveAccount('${id||''}')">Save account</button></div>`;}

else if(type==='recurring')h=`<h2>Recurring cost</h2><div class="field"><label>Cost type</label><input id="rCategory" placeholder="Salary / rent / transport"></div><div class="field"><label>Amount</label><input id="rAmount" type="number" step="0.01"></div><div class="field"><label>Frequency</label><select id="rFreq"><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select></div><div class="field"><label>Start date</label><input id="rStart" type="date" value="${iso()}"></div><div class="field"><label>End date (optional)</label><input id="rEnd" type="date"></div><div class="field"><label>Bank account</label><select id="rBank">${accountOptions()}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addRecurring()">Save recurring cost</button></div>`;
else if(type==='settings')h=`<h2>Settings & backup</h2><div class="notice">Your test data is stored on this browser/device using local storage. Export a backup before clearing Safari data or moving to another device.</div><div class="actions"><button class="primary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import backup</button></div><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)"><div class="section-title">Data</div><button class="danger" style="width:100%" onclick="resetData()">Reset all test data</button><div class="hint" style="margin-top:10px">This permanently clears this browser's app data.</div>`;

function closeModal(){document.getElementById('modal').classList.remove('show')}
function designOptions(){const d=[...new Set(db.rolls.filter(r=>!r.voided&&rollArea(r)>0).map(r=>r.design))].sort();return d.length?d.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join(''):'<option value="">No stock</option>'}
function refreshSaleColors(){const d=document.getElementById('sDesign')?.value||'';const cs=[...new Set(db.rolls.filter(r=>!r.voided&&rollArea(r)>0&&r.design===d).map(r=>r.color))].sort();document.getElementById('sColor').innerHTML=cs.length?cs.map(c=>`<option>${esc(c)}</option>`).join(''):'<option value="">No stock</option>';refreshAvailable()}
function availableFor(d,c){return db.rolls.filter(r=>!r.voided&&r.design===d&&r.color===c).reduce((s,r)=>s+rollArea(r),0)}
function refreshAvailable(){const d=document.getElementById('sDesign')?.value||'',c=document.getElementById('sColor')?.value||'',a=availableFor(d,c);const h=document.getElementById('availableHint');if(h)h.textContent='Available: '+a.toFixed(2)+' m²'}
function addRoll(){const design=document.getElementById('fDesign').value.trim(),color=document.getElementById('fColor').value.trim(),length=num(document.getElementById('fLength').value),cost=num(document.getElementById('fCost').value),type=document.getElementById('fPurchase').value;if(!design||!color||length<=0||cost<0)return alert('Please enter design, color, length and cost.');const m2=length*4,total=m2*cost,r={id:uid('roll'),rollId:'R-'+Date.now().toString().slice(-7),design,color,lengthM:length,widthM:4,originalM2:m2,remainingM2:m2,costPerM2:cost,purchaseTotal:total,purchaseType:type,accountId:type==='bank'?document.getElementById('fBank').value:null,date:new Date().toISOString()};if(type==='credit'){r.supplier=document.getElementById('fSupplier').value.trim();if(!r.supplier)return alert('Supplier name is required for supplier credit.');const debt={id:uid('debt'),supplier:r.supplier,invoice:document.getElementById('fInvoice').value.trim(),amount:total,dueDate:document.getElementById('fDue').value||'',date:r.date};r.debtId=debt.id;db.supplierDebts.push(debt)}db.rolls.push(r);closeModal();save()}
function addSale(){const design=document.getElementById('sDesign').value,color=document.getElementById('sColor').value,customer=document.getElementById('sCustomer').value.trim(),m2=num(document.getElementById('sM2').value),price=num(document.getElementById('sPrice').value),type=document.getElementById('sType').value;if(!design||!color||!customer||m2<=0||price<0)return alert('Please complete the sale.');const available=availableFor(design,color);if(m2>available+1e-9)return alert('Not enough stock. Available '+available.toFixed(2)+' m².');let need=m2,cost=0,alloc=[];const rolls=db.rolls.filter(r=>!r.voided&&r.design===design&&r.color===color&&rollArea(r)>0);for(const r of rolls){if(need<=0)break;const take=Math.min(need,rollArea(r));r.remainingM2-=take;alloc.push({rollId:r.id,m2:take,costPerM2:r.costPerM2});cost+=take*r.costPerM2;need-=take}const total=m2*price,s={id:uid('sale'),date:new Date().toISOString(),design,color,customer,areaM2:m2,pricePerM2:price,total,cost,grossProfit:total-cost,paymentType:type,accountId:type==='bank'?document.getElementById('sBank').value:null,allocations:alloc,voided:false};db.sales.push(s);if(type==='credit'){db.customers[customer]=db.customers[customer]||{name:customer,balance:0};db.customers[customer].balance+=total}closeModal();save()}
function voidSale(id){const s=db.sales.find(x=>x.id===id);if(!s||s.voided)return;if(!confirm('Void this sale? Inventory and customer/bank effects will be reversed.'))return;s.allocations.forEach(a=>{const r=db.rolls.find(x=>x.id===a.rollId);if(r)r.remainingM2+=a.m2});if(s.paymentType==='credit'){db.customers[s.customer]=db.customers[s.customer]||{name:s.customer,balance:0};db.customers[s.customer].balance-=s.total} s.voided=true;save()}
function deleteRoll(id){const r=db.rolls.find(x=>x.id===id);if(!r||r.voided)return;if(db.sales.some(s=>!s.voided&&s.allocations.some(a=>a.rollId===id)))return alert('This roll has already been used in a sale. Void the sale first.');if(r.debtId){const d=db.supplierDebts.find(x=>x.id===r.debtId);if(d&&!d.voided&&supplierPaid(d.id)>0)return alert('This roll has supplier payments. Delete/reverse those payments first.');if(d)d.voided=true}if(!confirm('Delete this roll? Its inventory and purchase balance effect will be reversed.'))return;r.voided=true;save()}
function addCustomerPayment(){const customer=document.getElementById('pCustomer').value.trim(),amount=num(document.getElementById('pAmount').value),accountId=document.getElementById('pBank').value;if(!customer||amount<=0)return alert('Enter customer and amount.');db.customers[customer]=db.customers[customer]||{name:customer,balance:0};if(customerBalance(customer)<=0)return alert('This customer has no outstanding credit.');if(amount>customerBalance(customer)+1e-9)return alert('Payment is greater than the customer outstanding balance.');db.customers[customer].balance-=amount;db.customerPayments.push({id:uid('cp'),customer,amount,accountId,date:new Date().toISOString(),voided:false});closeModal();save()}
function deleteCustomerPayment(id){const p=db.customerPayments.find(x=>x.id===id);if(!p||p.voided)return;if(!confirm('Delete this payment? Customer balance and bank will be reversed.'))return;p.voided=true;db.customers[p.customer].balance+=p.amount;save()}
function addSupplierPayment(){const id=document.getElementById('spDebt').value,d=db.supplierDebts.find(x=>x.id===id),amount=num(document.getElementById('spAmount').value),accountId=document.getElementById('spBank').value;if(!d||amount<=0)return alert('Enter an amount.');const rem=d.amount-supplierPaid(id);if(amount>rem+1e-9)return alert('Payment is greater than remaining supplier debt.');db.supplierPayments.push({id:uid('sp'),debtId:id,supplier:d.supplier,amount,accountId,date:new Date().toISOString(),voided:false});closeModal();save()}
function deleteSupplierPayment(id){const p=db.supplierPayments.find(x=>x.id===id);if(!p||p.voided)return;if(!confirm('Delete this supplier payment?'))return;p.voided=true;save()}
function addDebt(){const supplier=document.getElementById('dSupplier').value.trim(),amount=num(document.getElementById('dAmount').value);if(!supplier||amount<=0)return alert('Enter supplier and amount.');db.supplierDebts.push({id:uid('debt'),supplier,invoice:document.getElementById('dInvoice').value.trim(),amount,dueDate:document.getElementById('dDue').value||'',date:new Date().toISOString()});closeModal();save()}
function addExpense(){const category=document.getElementById('eCategory').value.trim(),amount=num(document.getElementById('eAmount').value),accountId=document.getElementById('eBank').value;if(!category||amount<=0)return alert('Enter expense type and amount.');db.expenses.push({id:uid('exp'),category,amount,date:document.getElementById('eDate').value||iso(),accountId,note:document.getElementById('eNote').value.trim(),voided:false});closeModal();save()}
function deleteExpense(id){const e=db.expenses.find(x=>x.id===id);if(!e||e.voided)return;if(!confirm('Delete this expense? Bank balance will be restored.'))return;e.voided=true;save()}
function saveAccount(id){const name=document.getElementById('aName').value.trim(),opening=num(document.getElementById('aOpening').value);if(!name)return alert('Bank name is required.');if(id){const a=db.accounts.find(x=>x.id===id);a.name=name;a.openingBalance=opening}else db.accounts.push({id:uid('acct'),name,openingBalance:opening});closeModal();save()}
function deleteAccount(id){if(db.accounts.length<=1)return alert('Keep at least one bank account.');if(!confirm('Delete this bank account? Existing transactions will remain but can no longer be reconciled to this account.'))return;db.accounts=db.accounts.filter(a=>a.id!==id);save()}
function addRecurring(){const category=document.getElementById('rCategory').value.trim(),amount=num(document.getElementById('rAmount').value),frequency=document.getElementById('rFreq').value,start=document.getElementById('rStart').value,end=document.getElementById('rEnd').value,accountId=document.getElementById('rBank').value;if(!category||amount<=0||!start)return alert('Complete the recurring cost.');db.recurringCosts.push({id:uid('rec'),category,amount,frequency,startDate:start,endDate:end||'',nextDue:start,accountId,active:true});closeModal();processRecurring();save()}
function advanceDate(s,f){const d=new Date(s+'T12:00:00');if(f==='weekly')d.setDate(d.getDate()+7);else if(f==='monthly')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);return iso(d)}
function processRecurring(){let changed=false;const today=iso();for(const r of db.recurringCosts||[]){while(r.active&&r.nextDue<=today&&(!r.endDate||r.nextDue<=r.endDate)){db.expenses.push({id:uid('auto'),category:r.category+' (recurring)',amount:r.amount,date:r.nextDue,accountId:r.accountId,note:'Automatic recurring cost',voided:false,recurringId:r.id});r.nextDue=advanceDate(r.nextDue,r.frequency);changed=true}}return changed}
function toggleRecurring(id){const r=db.recurringCosts.find(x=>x.id===id);if(r){r.active=!r.active;save()}}
function deleteRecurring(id){if(!confirm('Delete this recurring cost? Past expenses stay recorded.'))return;db.recurringCosts=db.recurringCosts.filter(x=>x.id!==id);save()}
function renderReport(){const el=document.getElementById('reportBody');const input=document.getElementById('reportMonth');if(!input)return;const m=input.value||iso().slice(0,7);input.value=m;const sales=db.sales.filter(s=>!s.voided&&ym(s.date)===m),ex=db.expenses.filter(e=>!e.voided&&ym(e.date)===m),cp=db.customerPayments.filter(p=>!p.voided&&ym(p.date)===m),sp=db.supplierPayments.filter(p=>!p.voided&&ym(p.date)===m);const revenue=sales.reduce((a,s)=>a+s.total,0),cost=sales.reduce((a,s)=>a+s.cost,0),gross=revenue-cost,expenses=ex.reduce((a,e)=>a+e.amount,0);el.innerHTML=`<div class="report"><h2>Carpet Business — ${m}</h2><div class="report-row"><span>Sales revenue</span><strong>${money(revenue)}</strong></div><div class="report-row"><span>Carpet cost sold</span><strong>${money(cost)}</strong></div><div class="report-row"><span>Gross profit</span><strong>${money(gross)}</strong></div><div class="report-row"><span>Expenses</span><strong>${money(expenses)}</strong></div><div class="report-row report-total"><span>Net profit</span><strong>${money(gross-expenses)}</strong></div><div class="subhead">Cash flow / balances</div><div class="report-row"><span>Bank balances</span><strong>${money(bankTotal())}</strong></div><div class="report-row"><span>Customer credit</span><strong>${money(customerCredit())}</strong></div><div class="report-row"><span>Supplier debt</span><strong>${money(supplierDebt())}</strong></div><div class="report-row"><span>Inventory quantity</span><strong>${inventoryM2().toFixed(2)} m²</strong></div><div class="report-row"><span>Inventory value</span><strong>${money(inventoryValue())}</strong></div><div class="subhead">Payments in selected month</div><div class="report-row"><span>Customer payments</span><strong>${money(cp.reduce((a,p)=>a+p.amount,0))}</strong></div><div class="report-row"><span>Supplier payments</span><strong>${money(sp.reduce((a,p)=>a+p.amount,0))}</strong></div></div>`}
function printReport(){go('report');setTimeout(()=>window.print(),80)}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='carpet-business-backup-'+iso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(ev){const file=ev.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.version||!Array.isArray(x.rolls))throw Error();db=normalize(x);processRecurring();save();closeModal();alert('Backup imported successfully.')}catch(e){alert('Invalid backup file.')}};r.readAsText(file)}
function resetData(){if(!confirm('Reset ALL app data on this browser?'))return;localStorage.removeItem(KEY);location.reload()}
// Process due recurring costs every time the app opens.
if(processRecurring())localStorage.setItem(KEY,JSON.stringify(db));
renderAll();
document.getElementById('today').textContent=new Date().toLocaleDateString();
</script>
</body></html>

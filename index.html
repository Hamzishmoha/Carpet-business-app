<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Carpet Business</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--blue:#2563eb;--good:#0f766e;--bad:#b91c1c;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.sub,.meta{font-size:12px;color:var(--muted)}.icon{width:42px;height:42px;border:0;border-radius:14px;background:#fff;font-size:18px}.screen{padding:0 18px}.page{display:none}.page.active{display:block}.hero{margin:8px 0 14px;padding:22px;border-radius:25px;background:#111827;color:#fff}.hero .label{font-size:13px;opacity:.7}.hero .amount{font-size:33px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.list{background:#fff;border:1px solid #fff;border-radius:var(--r);padding:15px;box-shadow:0 5px 18px #11182708}.metric{text-align:left;width:100%;border:0}.metric .title{font-size:12px;color:var(--muted)}.metric .value{font-size:20px;font-weight:800;margin-top:5px}.tap{font-size:11px;color:var(--blue);margin-top:7px}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 0 10px;font-weight:800}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button,.secondary,.primary{border-radius:13px;padding:11px 10px;font-weight:700}.quick button,.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.primary{background:#111827;color:#fff;border:0}.toolbar{display:flex;gap:8px;margin:10px 0}.search{flex:1;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.list{margin:9px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;margin:6px 5px 0 0}.click{width:100%;background:none;border:0;text-align:left;padding:0;color:inherit}.nested{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.nested-card{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;margin:7px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:5}.nav{border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;padding:5px}.nav.active{color:#111827}.nav span{display:block;font-size:20px;margin-bottom:2px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.activity{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.grow{flex:1}.dot{width:36px;height:36px;border-radius:12px;background:#eef2ff;display:grid;place-items:center}.good{color:var(--good)}.bad{color:var(--bad)}.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.hidden{display:none!important}.danger{color:var(--bad)!important}.money{font-variant-numeric:tabular-nums}
</style></head><body><div class="app"><div class="top"><div><div class="brand">Carpet Business</div><div class="sub">Business control center</div></div><button class="icon" onclick="openModal('settings')">⚙️</button></div><main class="screen">
<section id="dashboard" class="page active"><div class="hero"><div class="label">Total business balance</div><div class="amount money" id="totalBalance">ETB 0</div><div class="meta" style="color:#fff;opacity:.7;margin-top:14px" id="today"></div></div><div class="grid"><button class="card metric" onclick="go('money')"><div class="title">🏦 Bank</div><div class="value money" id="bankTotal">ETB 0</div><div class="tap">View accounts →</div></button><button class="card metric" onclick="go('money')"><div class="title">🧾 Supplier debt</div><div class="value money" id="debtTotal">ETB 0</div><div class="tap">View debt →</div></button><button class="card metric" onclick="go('customers')"><div class="title">🤝 Customer credit</div><div class="value money" id="creditTotal">ETB 0</div><div class="tap">View customers →</div></button><button class="card metric" onclick="go('inventory')"><div class="title">📦 Inventory</div><div class="value money" id="inventoryValue">ETB 0</div><div class="tap">View stock →</div></button></div><div class="section">Quick actions</div><div class="quick"><button onclick="openModal('roll')">📦<br>Add roll</button><button onclick="openModal('sale')">🧾<br>Sale</button><button onclick="openModal('payment')">💳<br>Payment</button><button onclick="openModal('expense')">💸<br>Cost</button></div><div class="section">This month</div><div class="grid"><div class="card metric"><div class="title">Sales</div><div class="value money" id="monthSales">ETB 0</div></div><div class="card metric"><div class="title">Gross profit</div><div class="value money" id="grossProfit">ETB 0</div></div><div class="card metric"><div class="title">Expenses</div><div class="value money" id="monthExpenses">ETB 0</div></div><div class="card metric"><div class="title">Net profit</div><div class="value money" id="netProfit">ETB 0</div></div></div><div class="section">Recent activity</div><div class="card" id="activity"></div></section>
<section id="inventory" class="page"><div class="section"><span>Inventory</span><button class="primary" onclick="openModal('roll')">+ Roll</button></div><div class="toolbar"><input id="inventorySearch" class="search" placeholder="Search design or color" oninput="renderInventory()"></div><div class="meta">Tap a design → tap a color → see individual rolls.</div><div id="inventoryList"></div></section>
<section id="sales" class="page"><div class="section"><span>Sales</span><button class="primary" onclick="openModal('sale')">+ Sale</button></div><div id="salesList"></div></section>
<section id="customers" class="page"><div class="section"><span>Customers</span><button class="primary" onclick="openModal('payment')">+ Payment</button></div><div id="customerList"></div></section>
<section id="money" class="page"><div class="section"><span>Money</span><button class="primary" onclick="openModal('expense')">+ Cost</button></div><div id="moneyList"></div></section>
</main><nav class="bottom"><button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span>⌂</span>Home</button><button class="nav" data-page="inventory" onclick="go('inventory')"><span>▦</span>Inventory</button><button class="nav" data-page="sales" onclick="go('sales')"><span>▤</span>Sales</button><button class="nav" data-page="customers" onclick="go('customers')"><span>♙</span>Customers</button><button class="nav" data-page="money" onclick="go('money')"><span>₿</span>Money</button></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><script>
const KEY='carpetBusinessMVP';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{rolls:[],sales:[],payments:[],expenses:[],accounts:[{id:'bank1',name:'Main Bank',balance:0}],customers:{},suppliers:{},recurringCosts:[]};
db.rolls=db.rolls||[];db.sales=db.sales||[];db.payments=db.payments||[];db.expenses=db.expenses||[];db.accounts=db.accounts?.length?db.accounts:[{id:'bank1',name:'Main Bank',balance:0}];db.customers=db.customers||{};db.suppliers=db.suppliers||{};db.recurringCosts=db.recurringCosts||[];
db.rolls.forEach(r=>{r.width=4;r.area=Number(r.area||r.length*4);r.remainingArea=Number(r.remainingArea??r.area);r.costPerSqM=Number(r.costPerSqM??r.cost??0);});
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function money(n){return 'ETB '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}function id(p){return p+Date.now()+Math.random().toString(16).slice(2,7)}function month(d=new Date()){return d.toISOString().slice(0,7)}function bankTotal(){return db.accounts.reduce((s,a)=>s+Number(a.balance||0),0)}function creditTotal(){return Object.values(db.customers).reduce((s,c)=>s+Number(c.balance||0),0)}function debtTotal(){return Object.values(db.suppliers).reduce((s,x)=>s+Number(x.balance||0),0)}function invValue(){return db.rolls.reduce((s,r)=>s+r.remainingArea*r.costPerSqM,0)}function salesMonth(){return db.sales.filter(x=>x.date?.slice(0,7)===month()).reduce((s,x)=>s+x.total,0)}function grossMonth(){return db.sales.filter(x=>x.date?.slice(0,7)===month()).reduce((s,x)=>s+x.grossProfit,0)}function expensesMonth(){return db.expenses.filter(x=>x.date?.slice(0,7)===month()).reduce((s,x)=>s+x.amount,0)}function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));renderAll();scrollTo(0,0)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(type){let s=document.getElementById('sheet'),h='';if(type==='roll'){h=`<h2>Add carpet roll</h2><div class="field"><label>Design</label><input id="rDesign" placeholder="Nahada / Niya / 136"><div class="meta" style="margin-top:5px">You can add unlimited rolls under the same design.</div></div><div class="field"><label>Color</label><input id="rColor" placeholder="Red / Beige / F-106"></div><div class="field"><label>Length (meters)</label><input id="rLength" type="number" step="0.01"></div><div class="field"><label>Purchase cost per m²</label><input id="rCost" type="number" step="0.01"></div><div class="field"><label>Purchase payment</label><select id="rPayment" onchange="toggleRollCredit()"><option value="bank:${db.accounts[0]?.id||''}">${esc(db.accounts[0]?.name||'Bank')}</option>${db.accounts.slice(1).map(a=>`<option value="bank:${a.id}">${esc(a.name)}</option>`).join('')}<option value="supplier_credit">Supplier credit</option></select></div><div id="rollCredit" class="hidden"><div class="field"><label>Supplier</label><input id="rSupplier" placeholder="Supplier name"></div><div class="field"><label>Due date</label><input id="rDue" type="date"></div></div><div class="card"><div class="meta">Width</div><strong>4 m (fixed)</strong><div class="meta" style="margin-top:7px">Purchase total: <span id="rollTotal">ETB 0</span></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addRoll()">Save roll</button></div>`}else if(type==='sale'){h=`<h2>Record sale</h2><div class="field"><label>Customer *</label><input id="sCustomer"></div><div class="field"><label>Design</label><input id="sDesign"></div><div class="field"><label>Color</label><input id="sColor"></div><div class="field"><label>m² sold</label><input id="sArea" type="number" step="0.01"></div><div class="field"><label>Selling price / m²</label><input id="sPrice" type="number" step="0.01"></div><div class="field"><label>Payment</label><select id="sPay" onchange="toggleSaleBank()"><option value="credit">Customer credit</option><option value="bank">Bank transfer</option></select></div><div id="saleBank" class="field hidden"><label>Bank account</label><select id="sAccount">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addSale()">Save sale</button></div>`}else if(type==='payment'){let cs=Object.values(db.customers).filter(c=>c.balance>0);h=`<h2>Customer payment</h2><div class="field"><label>Customer</label><select id="pCustomer">${cs.map(c=>`<option value="${esc(c.name)}">${esc(c.name)} — ${money(c.balance)}</option>`).join('')||'<option>No outstanding customer credit</option>'}</select></div><div class="field"><label>Amount</label><input id="pAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="pAccount">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addPayment()">Record payment</button></div>`}else if(type==='supplierPayment'){let ss=Object.values(db.suppliers).filter(x=>x.balance>0);h=`<h2>Pay supplier</h2><div class="field"><label>Supplier</label><select id="spSupplier">${ss.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} — ${money(x.balance)}</option>`).join('')||'<option>No supplier debt</option>'}</select></div><div class="field"><label>Amount</label><input id="spAmount" type="number" step="0.01"></div><div class="field"><label>Bank account</label><select id="spAccount">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="paySupplier()">Record payment</button></div>`}else if(type==='expense'){h=`<h2>Add cost</h2><div class="field"><label>Cost type</label><select id="eCat" onchange="toggleCustomCost()"><option>Salary</option><option>Labor</option><option>Transportation</option><option>Rent</option><option>Utilities</option><option>Marketing</option><option>Repairs</option><option>Other</option><option value="custom">+ New type</option></select></div><div id="customCat" class="field hidden"><label>New cost type</label><input id="eCustom"></div><div class="field"><label>Amount</label><input id="eAmount" type="number" step="0.01"></div><div class="field"><label>Payment from</label><select id="eAccount">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Schedule</label><select id="eSchedule" onchange="toggleRecurring()"><option value="once">One-time</option><option value="recurring">Recurring</option></select></div><div id="recFields" class="hidden"><div class="field"><label>Frequency</label><select id="eFreq"><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select></div><div class="field"><label>First due date</label><input id="eStart" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="meta">Recurring costs are recorded when you open the app on/after the due date.</div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addExpense()">Save cost</button></div>`}else if(type==='settings'){h=`<h2>Settings</h2><div class="section">Bank accounts</div>${db.accounts.map(a=>`<div class="list"><div class="row"><div><strong>${esc(a.name)}</strong><div class="meta">Current balance ${money(a.balance)}</div></div><button class="secondary" onclick="renameBank('${a.id}')">Rename</button></div></div>`).join('')}<div class="actions"><button class="secondary" onclick="addBank()">+ Bank account</button><button class="secondary" onclick="openModal('supplierPayment')">Pay supplier</button></div><div class="meta" style="margin-top:12px">Cash is not used in this business model.</div><div class="actions"><button class="primary" onclick="closeModal()">Close</button></div>`}s.innerHTML=h;document.getElementById('modal').classList.add('show');if(type==='roll'){['rLength','rCost'].forEach(x=>document.getElementById(x).addEventListener('input',updateRollTotal));updateRollTotal();toggleRollCredit()}}
function closeModal(){document.getElementById('modal').classList.remove('show')}function toggleRollCredit(){document.getElementById('rollCredit')?.classList.toggle('hidden',document.getElementById('rPayment').value!=='supplier_credit')}function toggleSaleBank(){document.getElementById('saleBank')?.classList.toggle('hidden',document.getElementById('sPay').value!=='bank')}function toggleCustomCost(){document.getElementById('customCat')?.classList.toggle('hidden',document.getElementById('eCat').value!=='custom')}function toggleRecurring(){document.getElementById('recFields')?.classList.toggle('hidden',document.getElementById('eSchedule').value!=='recurring')}function updateRollTotal(){let n=+document.getElementById('rLength')?.value||0,c=+document.getElementById('rCost')?.value||0;let el=document.getElementById('rollTotal');if(el)el.textContent=money(n*4*c)}
function addBank(){let name=prompt('Bank account name');if(!name?.trim())return;name=name.trim();if(db.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()))return alert('That bank account already exists.');let opening=Number(prompt('Opening balance (ETB)','0')||0);if(opening<0)return alert('Opening balance cannot be negative.');db.accounts.push({id:id('B'),name,balance:opening});save();openModal('settings')}function renameBank(aid){let a=db.accounts.find(x=>x.id===aid);if(!a)return;let name=prompt('New bank name',a.name);if(!name?.trim())return;if(db.accounts.some(x=>x.id!==aid&&x.name.toLowerCase()===name.trim().toLowerCase()))return alert('That bank account already exists.');a.name=name.trim();db.payments.forEach(p=>{if(p.accountId===aid)p.account=a.name});save();openModal('settings')}
function addRoll(){let design=document.getElementById('rDesign').value.trim(),color=document.getElementById('rColor').value.trim(),len=+document.getElementById('rLength').value,cost=+document.getElementById('rCost').value,choice=document.getElementById('rPayment').value;if(!design||!color||len<=0||cost<=0)return alert('Complete design, color, length and cost.');let area=len*4,total=area*cost,source='';let supplier=null,due=null;if(choice==='supplier_credit'){supplier=document.getElementById('rSupplier').value.trim();due=document.getElementById('rDue').value;if(!supplier||!due)return alert('Enter supplier and due date.');if(!db.suppliers[supplier])db.suppliers[supplier]={name:supplier,balance:0,purchases:[],payments:[]};db.suppliers[supplier].balance+=total;db.suppliers[supplier].purchases.push({date:new Date().toISOString(),amount:total,dueDate:due,design,color});source='supplier_credit'}else{let aid=choice.split(':')[1],a=db.accounts.find(x=>x.id===aid);if(!a||a.balance<total)return alert('Not enough bank balance.');a.balance-=total;source=aid}db.rolls.push({id:id('R'),design,color,length:len,width:4,area,remainingArea:area,costPerSqM:cost,purchaseTotal:total,paymentSource:source,supplier,supplierDue:due,date:new Date().toISOString()});closeModal();save()}
function addSale(){let customer=document.getElementById('sCustomer').value.trim(),design=document.getElementById('sDesign').value.trim(),color=document.getElementById('sColor').value.trim(),area=+document.getElementById('sArea').value,price=+document.getElementById('sPrice').value,pay=document.getElementById('sPay').value,aid=document.getElementById('sAccount')?.value;if(!customer||!design||!color||area<=0||price<=0)return alert('Complete all sale fields.');let rolls=db.rolls.filter(r=>r.design.toLowerCase()===design.toLowerCase()&&r.color.toLowerCase()===color.toLowerCase()&&r.remainingArea>0),avail=rolls.reduce((s,r)=>s+r.remainingArea,0);if(area>avail)return alert(`Not enough stock. Available: ${avail.toFixed(2)} m².`);if(pay==='bank'&&!db.accounts.some(a=>a.id===aid))return alert('Select a bank account.');let left=area,costTotal=0,alloc=[];for(let r of rolls){let take=Math.min(left,r.remainingArea);r.remainingArea-=take;costTotal+=take*r.costPerSqM;alloc.push({rollId:r.id,area:take});left-=take;if(left<=0)break}let total=area*price;if(!db.customers[customer])db.customers[customer]={name:customer,balance:0};if(pay==='credit')db.customers[customer].balance+=total;else db.accounts.find(a=>a.id===aid).balance+=total;db.sales.unshift({id:id('S'),date:new Date().toISOString(),customer,design,color,areaM2:area,price,total,costOfSale:costTotal,grossProfit:total-costTotal,payment:pay,accountId:pay==='bank'?aid:null,allocations:alloc});closeModal();save()}
function addPayment(){let name=document.getElementById('pCustomer').value,amt=+document.getElementById('pAmount').value,aid=document.getElementById('pAccount').value,c=db.customers[name],a=db.accounts.find(x=>x.id===aid);if(!c||amt<=0||!a)return alert('Complete the payment.');if(amt>c.balance)return alert('Payment is greater than customer credit.');c.balance-=amt;a.balance+=amt;db.payments.unshift({id:id('P'),date:new Date().toISOString(),customer:name,amount:amt,accountId:aid,account:a.name});closeModal();save()}
function paySupplier(){let name=document.getElementById('spSupplier').value,amt=+document.getElementById('spAmount').value,aid=document.getElementById('spAccount').value,s=db.suppliers[name],a=db.accounts.find(x=>x.id===aid);if(!s||amt<=0||!a)return alert('Complete supplier payment.');if(amt>s.balance)return alert('Payment is greater than supplier debt.');if(amt>a.balance)return alert('Not enough bank balance.');a.balance-=amt;s.balance-=amt;s.payments=s.payments||[];s.payments.unshift({id:id('SP'),date:new Date().toISOString(),amount:amt,accountId:aid,account:a.name});closeModal();save()}
function costCategory(){let v=document.getElementById('eCat').value;return v==='custom'?document.getElementById('eCustom').value.trim():v}
function addExpense(){let cat=costCategory(),amt=+document.getElementById('eAmount').value,aid=document.getElementById('eAccount').value,a=db.accounts.find(x=>x.id===aid),rec=document.getElementById('eSchedule').value==='recurring';if(!cat||amt<=0||!a)return alert('Complete the cost fields.');if(rec){let freq=document.getElementById('eFreq').value,start=document.getElementById('eStart').value;if(!start)return alert('Choose a start date.');db.recurringCosts.push({id:id('RC'),category:cat,amount:amt,source:aid,frequency:freq,nextDue:start,active:true});processRecurringCosts();closeModal();save();return}if(a.balance<amt)return alert('Not enough bank balance.');a.balance-=amt;db.expenses.unshift({id:id('E'),date:new Date().toISOString(),category:cat,amount:amt,source:aid,recurring:false});closeModal();save()}
function nextDate(d,f){let x=new Date(d);if(f==='weekly')x.setDate(x.getDate()+7);else if(f==='monthly')x.setMonth(x.getMonth()+1);else x.setFullYear(x.getFullYear()+1);return x.toISOString().slice(0,10)}function processRecurringCosts(){let today=new Date().toISOString().slice(0,10),changed=false;for(let r of db.recurringCosts){if(!r.active)continue;while(r.nextDue<=today){let a=db.accounts.find(x=>x.id===r.source);if(!a||a.balance<r.amount)break;a.balance-=r.amount;db.expenses.unshift({id:id('E'),date:r.nextDue+'T00:00:00',category:r.category,amount:r.amount,source:r.source,recurring:true,recurringId:r.id});r.nextDue=nextDate(r.nextDue,r.frequency);changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(db))}
function pauseRecurring(idv){let r=db.recurringCosts.find(x=>x.id===idv);if(r){r.active=!r.active;save()}}function deleteRecurring(idv){if(confirm('Delete this recurring cost?')){db.recurringCosts=db.recurringCosts.filter(x=>x.id!==idv);save()}}
function voidSale(idv){let s=db.sales.find(x=>x.id===idv);if(!s||!confirm(`Void sale to ${s.customer}? Inventory and money will be restored.`))return;for(let al of s.allocations||[]){let r=db.rolls.find(x=>x.id===al.rollId);if(r)r.remainingArea+=Number(al.area)}if(s.payment==='credit'){if(!db.customers[s.customer]||db.customers[s.customer].balance<s.total)return alert('Reverse customer payments first.');db.customers[s.customer].balance-=s.total}else{let a=db.accounts.find(x=>x.id===s.accountId);if(!a||a.balance<s.total)return alert('Bank balance is too low to reverse this sale.');a.balance-=s.total}db.sales=db.sales.filter(x=>x.id!==idv);save()}
function deletePayment(idv){let p=db.payments.find(x=>x.id===idv);if(!p||!confirm('Delete this payment and reverse it?'))return;let a=db.accounts.find(x=>x.id===p.accountId),c=db.customers[p.customer];if(!a||!c)return alert('Cannot reverse this payment.');a.balance-=p.amount;c.balance+=p.amount;db.payments=db.payments.filter(x=>x.id!==idv);save()}
function deleteExpense(idv){let e=db.expenses.find(x=>x.id===idv);if(!e||!confirm('Delete this cost and restore the bank balance?'))return;let a=db.accounts.find(x=>x.id===e.source);if(!a)return alert('Bank account no longer exists.');a.balance+=e.amount;db.expenses=db.expenses.filter(x=>x.id!==idv);save()}
function deleteRoll(idv){let r=db.rolls.find(x=>x.id===idv);if(!r)return;if(Math.abs(r.remainingArea-r.area)>0.000001)return alert('This roll has been partly or fully sold. Void the related sale first.');if(!confirm('Delete this roll?'))return;if(r.paymentSource==='supplier_credit'){let s=db.suppliers[r.supplier];if(!s||s.balance<r.purchaseTotal)return alert('Supplier debt cannot be reversed safely.');s.balance-=r.purchaseTotal}else{let a=db.accounts.find(x=>x.id===r.paymentSource);if(!a)return alert('Bank account no longer exists.');a.balance+=r.purchaseTotal}db.rolls=db.rolls.filter(x=>x.id!==idv);save()}
function renderInventory(){let q=(document.getElementById('inventorySearch')?.value||'').toLowerCase(),groups={};for(let r of db.rolls.filter(x=>x.remainingArea>0.000001)){let dk=r.design.trim().toLowerCase(),ck=r.color.trim().toLowerCase();groups[dk]??={design:r.design,area:0,colors:{}};groups[dk].area+=r.remainingArea;groups[dk].colors[ck]??={color:r.color,area:0,rolls:[]};groups[dk].colors[ck].area+=r.remainingArea;groups[dk].colors[ck].rolls.push(r)}let html=Object.values(groups).filter(g=>(g.design+' '+Object.values(g.colors).map(c=>c.color).join(' ')).toLowerCase().includes(q)).sort((a,b)=>a.design.localeCompare(b.design)).map(g=>`<div class="list"><button class="click" onclick="toggleDesign('${btoa(unescape(encodeURIComponent(g.design)))}')"><div class="row"><div><strong>${esc(g.design)}</strong><div class="meta">${Object.keys(g.colors).length} color${Object.keys(g.colors).length===1?'':'s'}</div></div><strong>${g.area.toFixed(2)} m²</strong></div><span class="pill">Tap for colors</span></button><div id="design-${btoa(unescape(encodeURIComponent(g.design)))}" class="nested hidden">${Object.values(g.colors).sort((a,b)=>a.color.localeCompare(b.color)).map(c=>{let key=btoa(unescape(encodeURIComponent(g.design+'|'+c.color)));return `<div class="nested-card"><button class="click" onclick="toggleColor('${key}')"><div class="row"><div><strong>${esc(c.color)}</strong><div class="meta">${c.rolls.length} roll${c.rolls.length===1?'':'s'}</div></div><strong>${c.area.toFixed(2)} m²</strong></div><span class="pill">Tap for rolls</span></button><div id="color-${key}" class="nested hidden">${c.rolls.map(r=>`<div class="activity"><div class="dot">📦</div><div class="grow"><strong>Roll ${esc(r.id)}</strong><div class="meta">${Number(r.length).toFixed(2)} m · ${Number(r.remainingArea).toFixed(2)} m² · ${money(r.costPerSqM)}/m²</div></div><button class="secondary danger" onclick="deleteRoll('${r.id}')">Delete</button></div>`).join('')}</div></div>`}).join('')}</div></div>`).join('');document.getElementById('inventoryList').innerHTML=html||'<div class="empty">No inventory yet.</div>'}
function toggleDesign(k){document.getElementById('design-'+k)?.classList.toggle('hidden')}function toggleColor(k){document.getElementById('color-'+k)?.classList.toggle('hidden')}
function renderSales(){document.getElementById('salesList').innerHTML=db.sales.length?db.sales.map(s=>`<div class="list"><div class="row"><div><strong>${esc(s.design)} · ${esc(s.color)}</strong><div class="meta">${esc(s.customer)} · ${new Date(s.date).toLocaleDateString()}</div></div><strong>${money(s.total)}</strong></div><span class="pill">${s.areaM2.toFixed(2)} m²</span><span class="pill">${money(s.price)}/m²</span><span class="pill">${s.payment}</span><span class="pill good">Gross ${money(s.grossProfit)}</span><button class="secondary danger" style="width:100%;margin-top:9px" onclick="voidSale('${s.id}')">Void sale</button></div>`).join(''):'<div class="empty">No sales yet.</div>'}
function renderCustomers(){let cs=Object.values(db.customers).filter(c=>c.balance>0);document.getElementById('customerList').innerHTML=cs.length?cs.map(c=>`<div class="list"><div class="row"><div><strong>${esc(c.name)}</strong><div class="meta">Outstanding credit</div></div><strong class="bad">${money(c.balance)}</strong></div></div>`).join(''):'<div class="empty">No outstanding customer credit.</div>'}
function accountActivity(aid){let rows=[];db.sales.filter(s=>s.payment==='bank'&&s.accountId===aid).forEach(s=>rows.push({date:s.date,type:'Sale',name:s.customer,amount:s.total,in:true}));db.payments.filter(p=>p.accountId===aid).forEach(p=>rows.push({date:p.date,type:'Customer payment',name:p.customer,amount:p.amount,in:true}));db.rolls.filter(r=>r.paymentSource===aid).forEach(r=>rows.push({date:r.date,type:'Carpet purchase',name:r.design+' · '+r.color,amount:r.purchaseTotal,in:false}));db.expenses.filter(e=>e.source===aid).forEach(e=>rows.push({date:e.date,type:e.category,name:'Cost',amount:e.amount,in:false}));Object.values(db.suppliers).forEach(s=>(s.payments||[]).filter(p=>p.accountId===aid).forEach(p=>rows.push({date:p.date,type:'Supplier payment',name:s.name,amount:p.amount,in:false})));return rows.sort((a,b)=>new Date(b.date)-new Date(a.date))}
function renderMoney(){let accounts=db.accounts.map(a=>`<div class="list"><div class="row"><div><strong>${esc(a.name)}</strong><div class="meta">${money(a.balance)}</div></div><button class="secondary" onclick="showAccount('${a.id}')">Transactions</button></div><div id="acct-${a.id}" class="nested hidden">${accountActivity(a.id).map(x=>`<div class="activity"><div class="dot">${x.in?'↗️':'↘️'}</div><div class="grow"><strong>${esc(x.type)}</strong><div class="meta">${esc(x.name)} · ${new Date(x.date).toLocaleDateString()}</div></div><strong class="${x.in?'good':'bad'}">${x.in?'+':'−'}${money(x.amount)}</strong></div>`).join('')||'<div class="empty">No transactions.</div>'}</div></div>`).join('');let debts=Object.values(db.suppliers).filter(s=>s.balance>0).map(s=>`<div class="list"><div class="row"><div><strong>${esc(s.name)}</strong><div class="meta">${s.purchases?.length||0} credit purchase(s)</div></div><strong class="bad">${money(s.balance)}</strong></div>${s.purchases?.slice(-3).reverse().map(p=>`<div class="meta" style="margin-top:7px">${esc(p.design)} · ${esc(p.color)} · ${money(p.amount)} · due ${new Date(p.dueDate+'T00:00:00').toLocaleDateString()}</div>`).join('')||''}</div>`).join('')||'<div class="empty">No supplier debt.</div>';let ex=db.expenses.slice(0,20).map(e=>`<div class="list"><div class="row"><div><strong>${esc(e.category)}</strong><div class="meta">${new Date(e.date).toLocaleDateString()} · ${esc(db.accounts.find(a=>a.id===e.source)?.name||'Bank')}</div></div><strong class="bad">−${money(e.amount)}</strong></div><button class="secondary danger" style="margin-top:8px;width:100%" onclick="deleteExpense('${e.id}')">Delete cost</button></div>`).join('')||'<div class="empty">No costs yet.</div>';let rec=db.recurringCosts.map(r=>`<div class="list"><div class="row"><div><strong>${esc(r.category)}</strong><div class="meta">${money(r.amount)} · ${r.frequency} · next ${new Date(r.nextDue+'T00:00:00').toLocaleDateString()}</div></div><button class="secondary" onclick="pauseRecurring('${r.id}')">${r.active?'Pause':'Resume'}</button></div><button class="secondary danger" style="margin-top:8px;width:100%" onclick="deleteRecurring('${r.id}')">Delete recurring cost</button></div>`).join('')||'<div class="empty">No recurring costs.</div>';document.getElementById('moneyList').innerHTML=`<div class="card"><div class="row"><strong>Total bank</strong><strong>${money(bankTotal())}</strong></div><div class="meta" style="margin-top:5px">Combined bank balance</div></div><div class="section"><span>Bank accounts</span><button class="secondary" onclick="openModal('settings')">Manage</button></div>${accounts}<div class="section"><span>Supplier debt</span><button class="primary" onclick="openModal('supplierPayment')">Pay supplier</button></div>${debts}<div class="section">Customer payments</div>${db.payments.slice(0,20).map(p=>`<div class="list"><div class="row"><div><strong>${esc(p.customer)}</strong><div class="meta">${esc(p.account)} · ${new Date(p.date).toLocaleDateString()}</div></div><strong class="good">+${money(p.amount)}</strong></div><button class="secondary danger" style="margin-top:8px;width:100%" onclick="deletePayment('${p.id}')">Delete payment</button></div>`).join('')||'<div class="empty">No customer payments.</div>'}<div class="section">Costs</div>${ex}<div class="section">Recurring costs</div>${rec}`}
function showAccount(id){document.getElementById('acct-'+id)?.classList.toggle('hidden')}
function renderDashboard(){document.getElementById('bankTotal').textContent=money(bankTotal());document.getElementById('debtTotal').textContent=money(debtTotal());document.getElementById('creditTotal').textContent=money(creditTotal());document.getElementById('inventoryValue').textContent=money(invValue());document.getElementById('totalBalance').textContent=money(bankTotal()+creditTotal()+invValue()-debtTotal());document.getElementById('monthSales').textContent=money(salesMonth());document.getElementById('grossProfit').textContent=money(grossMonth());document.getElementById('monthExpenses').textContent=money(expensesMonth());document.getElementById('netProfit').textContent=money(grossMonth()-expensesMonth());document.getElementById('today').textContent=new Date().toLocaleDateString();let a=db.sales.slice(0,5).map(s=>`<div class="activity"><div class="dot">🧾</div><div class="grow"><strong>Sale · ${esc(s.design)} ${esc(s.color)}</strong><div class="meta">${esc(s.customer)} · ${s.areaM2.toFixed(2)} m²</div></div><strong>${money(s.total)}</strong></div>`).join('');document.getElementById('activity').innerHTML=a||'<div class="empty">No activity yet.</div>'}
function renderAll(){renderDashboard();renderInventory();renderSales();renderCustomers();renderMoney()}processRecurringCosts();renderAll();
</script></body></html>
